<style>
  :root { --bg:hsl(210 20% 98%); --panel:#fff; --line:hsl(215 25% 88%); --ink:hsl(215 40% 16%); --dim:hsl(215 15% 46%); --mid:hsl(215 20% 36%); --accent:hsl(215 60% 22%); --accent2:hsl(215 60% 17%); --tint:hsl(210 20% 94%); --tint2:hsl(210 20% 94%); --alert:hsl(0 80% 96%); --warn:hsl(0 72% 42%); --agent:hsl(248 52% 52%); --shadow:none; --display:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',var(--mono); }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 'IBM Plex Sans',-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); display:flex; height:100vh }
  nav { width:236px; padding:20px 12px; background:var(--bg); flex:none; overflow:auto }
  nav h1 { font:700 14px var(--display); letter-spacing:.06em; color:var(--ink); margin:0 0 4px 12px }
  nav a { display:block; padding:9px 12px; cursor:pointer; color:var(--ink); text-decoration:none; border-radius:6px; font-size:14.5px }
  nav a:hover { background:var(--tint2) } nav a.on { background:var(--tint); color:var(--accent); font-weight:600; font-family:var(--display); box-shadow:inset 2px 0 0 var(--accent) }
  nav .grp { font:700 12px var(--display); color:var(--dim);
    padding:16px 12px 6px; cursor:pointer; display:flex; justify-content:space-between; user-select:none; line-height:1.2 }
  nav .grp:hover { color:var(--accent) }
  nav .grp .tog { font-size:12px; line-height:1 }
  nav .grp-items.closed { display:none }
  nav .grp-items a { padding:8px 12px 8px 18px; line-height:1.45; margin:1px 0 }
  nav .grp-items a.on { padding-left:18px }
  /* nav links must never pick up the .sub subtitle styling — they are structural siblings, not captions */
  main { flex:1; overflow:auto; padding:28px 34px }
  h2 { margin:0 0 4px; font:700 24px var(--display); letter-spacing:-.02em } .sub { color:var(--dim); margin-bottom:18px; font-size:13.5px }
  table { border-collapse:collapse; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow) }
  th { text-align:left; font:700 11.5px var(--display); color:var(--dim); padding:11px 14px; border-bottom:1px solid var(--line) }
  td { padding:10px 14px; border-bottom:1px solid hsl(215 25% 93%) } tr:last-child td { border-bottom:none }
  tbody tr { cursor:pointer } tbody tr:hover { background:var(--bg) }
  .num { text-align:right; font-variant-numeric:tabular-nums }
  .pill { font:700 11px var(--display); padding:3px 9px; border-radius:4px; background:var(--tint2); color:var(--mid) }
  .pill.confirmed,.pill.sent,.pill.issued,.pill.submitted { background:#E3ECF7; color:#2C5282 } .pill.shipped { background:#E8F0E2; color:#3E6B2B }
  .pill.closed,.pill.paid,.pill.accepted { background:var(--tint); color:var(--accent) } .pill.cancelled,.pill.void,.pill.rejected,.pill.ghosted { background:var(--alert); color:var(--warn) }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow) }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 22px }
  .kv div span { display:block; font:600 12px var(--display); color:var(--dim); margin-bottom:2px }
  button { font:700 13px var(--display); padding:8px 14px; border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; color:var(--ink) }
  button:hover:not(:disabled) { background:var(--tint); border-color:var(--tint); color:var(--accent) }
  button:disabled { opacity:.42; cursor:not-allowed }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); border-radius:6px; box-shadow:none }
  button.primary:hover:not(:disabled) { background:var(--accent2); border-color:var(--accent2); color:#fff }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px }
  dialog { border:1px solid var(--line); border-radius:8px; padding:0; width:min(560px,92vw); box-shadow:0 20px 60px rgba(43,42,51,.14) }
  dialog header { padding:18px 22px 12px; border-bottom:1px solid var(--line) } dialog header b { font:700 18px var(--display) }
  .help { white-space:pre-wrap; font-size:12.5px; color:var(--mid); margin-top:8px; background:var(--bg); border-radius:6px; padding:8px 12px }
  form { padding:18px 20px; max-height:58vh; overflow:auto } dialog footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end }
  label { display:block; margin-bottom:13px } label b { font:700 13.5px var(--display); display:block; margin-bottom:3px } label i { font-style:normal; color:var(--dim); font-size:12px; display:block; margin-bottom:4px }
  input,select,textarea { font:inherit; width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:6px; background:var(--panel) }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--tint); border-color:var(--accent) }
  .req b:after { content:" *"; color:var(--warn) }
  .lines td { padding:4px } .lines input,.lines select { padding:4px 6px }
  .err { color:var(--warn); padding:0 20px 10px; white-space:pre-wrap }
  .who { font-size:11px; padding:1px 7px; border-radius:4px; font-weight:600; font-family:var(--mono) }
  .who.human { background:#E3ECF7; color:#2C5282 } .who.agent { background:hsl(248 60% 96%); color:var(--agent) }
  .doc { font-size:12.5px; color:var(--dim); white-space:pre-wrap; line-height:1.6 }
  .badge { font-size:11px; font-weight:600; padding:2px 9px; border-radius:8px }
  .badge.pass { background:var(--tint); color:var(--accent) } .badge.fail { background:var(--alert); color:var(--warn) }
  .step { border-left:3px solid var(--line); padding:8px 12px; margin:8px 0; font-size:13px }
  .step.pass { border-left-color:var(--accent) } .step.fail { border-left-color:var(--warn) }
  .step .hd { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap }
  .step .act-name { font-weight:600 } .step .cmd { color:var(--dim); font-size:12px }
  .step .teach { color:var(--dim); font-style:italic; margin-top:4px }
  .step pre { margin:5px 0 0; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:6px 9px; font-size:11.5px; overflow-x:auto; white-space:pre-wrap; word-break:break-word }
  details.scen { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; box-shadow:var(--shadow) }
  details.scen summary { padding:12px 16px; cursor:pointer; display:flex; gap:10px; align-items:center; list-style:none }
  details.scen summary::-webkit-details-marker { display:none }
  details.scen .body { padding:0 16px 14px }
  .invrow td:first-child { font-family:var(--mono); font-size:12px; color:var(--accent) }
  #walkOv { position:fixed; inset:0; background:color-mix(in srgb, var(--ink) 42%, transparent); display:flex; align-items:center; justify-content:center; z-index:50 }
  .walk { background:var(--bg); border:1px solid var(--line); border-radius:8px; width:min(680px,94vw); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 24px 70px #0004 }
  .walk header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px }
  .walk header .prog { flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden }
  .walk header .prog i { display:block; height:100%; background:var(--accent); transition:width .25s }
  .walk .body { padding:18px 22px; overflow:auto }
  .walk .phase { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }
  .walk h3.act { margin:2px 0 2px; font-size:19px } .walk .cmdname { font-family:var(--mono); font-size:12px; color:var(--dim) }
  .walk .note { background:var(--tint); border-radius:6px; padding:10px 14px; margin:12px 0; font-size:14px }
  .walk .formprev { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin:10px 0 }
  .walk .formprev label { margin-bottom:10px } .walk .formprev input { background:var(--bg); color:var(--ink) }
  .walk .expect { font-size:13px; color:var(--dim); margin:10px 0 }
  .walk .outcome { border-radius:8px; padding:12px 14px; margin-top:10px; font-size:13.5px; white-space:pre-wrap; word-break:break-word }
  .walk .outcome.pass { background:var(--tint); color:hsl(215 60% 17%) } .walk .outcome.fail { background:var(--alert); color:var(--warn) }
  :root[data-x] .noop {}
  .walk footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; align-items:center }
  .walk .stepno { color:var(--dim); font-size:12.5px; margin-right:auto }
</style>

  <h1 style="letter-spacing:.08em;display:flex;align-items:center;gap:6px"><svg class="wv" width="14" height="16" viewBox="0 0 22 26" fill="none" stroke="hsl(215 60% 22%)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 10a5 5 0 0 1 0 6" opacity=".3"/><path d="M10.5 7a9.5 9.5 0 0 1 0 12" opacity=".6"/><path d="M16.5 3.5a14.5 14.5 0 0 1 0 19"/></svg><span>SAYBOOKS</span><svg class="wv" width="14" height="16" viewBox="0 0 22 26" fill="none" stroke="hsl(215 60% 22%)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 10a5 5 0 0 1 0 6"/><path d="M10.5 7a9.5 9.5 0 0 1 0 12" opacity=".6"/><path d="M16.5 3.5a14.5 14.5 0 0 1 0 19" opacity=".3"/></svg></h1>
  <div id="brandline" style="padding:0 18px 10px;font-size:11px;color:var(--dim);line-height:1.5">the books you can talk to —<br>that stay books</div>
  <div id="wsBox" style="padding:0 18px 12px"></div>
  <div class="grp" data-g="books">Books · o2c <span class="tog">−</span></div>
  <div class="grp-items" data-gi="books">
    <a class="on" data-v="orders">Orders</a><a data-v="customers">Customers</a><a data-v="items">Items</a>
    <a data-v="ar">AR aging</a><a data-v="cash">Unapplied cash</a><a data-v="journal">Journal</a>
  </div>

  <div class="grp-items" data-gi="crm">
    <a data-v="today">Today</a><a data-v="campaigns">Campaigns</a><a data-v="accounts">Accounts</a><a data-v="crmcontacts">Contacts</a>
    <a data-v="crmpipeline">Pipeline</a><a data-v="network">Network</a><a data-v="crmactivity">Activity</a>

  </div>

<main id="main"></main>
<dialog id="dlg"></dialog>
<script>
/* The entire UI. It contains no form for any specific command: every input below is built
   from the field specs the server derives from the same declaration the MCP tools come from.
   Adding a command to src/commands/ makes it appear here, correctly, with zero edits to this file. */
/* <template> rather than a <div>: the HTML parser discards <tr>/<td> that are not inside a
   table, and half this UI builds table fragments. */
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
/* The workspace rides on every API call; the ?ws= in the address bar is the source of truth
   and the server cookie is only a fallback for a bare URL. */
const WSQ = new URLSearchParams(location.search).get('ws');
const DEMOQ = new URLSearchParams(location.search).get('demo');   // demo flavor: which sandbox the server mints
const wsUrl = (u) => {
  const q = [];
  if (WSQ) q.push('ws=' + encodeURIComponent(WSQ));
  if (DEMOQ) q.push('demo=' + encodeURIComponent(DEMOQ));
  return q.length ? u + (u.includes('?') ? '&' : '?') + q.join('&') : u;
};
const cents = (c) => c == null ? '' : '$' + (c/100).toFixed(2);
function toast(msg) {
  const t = $(`<div style="position:fixed;bottom:22px;right:22px;background:hsl(215 60% 22%);color:#fff;padding:10px 16px;border-radius:6px;font-size:13.5px;box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:99;opacity:0;transition:opacity .25s">${msg}</div>`);
  document.body.append(t);
  requestAnimationFrame(() => t.style.opacity = '1');
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2600);
}

const api = async (cmd, args = {}) => {
  const r = await fetch(wsUrl('/api/cmd/' + cmd), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(args) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j.result;
};
let REG = null, view = 'orders', selected = null, huntStage = null, journalRange = {};

/* ---------- generated form ---------- */
function openForm(spec, prefill = {}) {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '';
  dlg.append($(`<header><b>${spec.title}</b>${spec.help ? `<div class="help">${spec.help}</div>` : ''}</header>`));
  const form = document.createElement('form');
  const state = { ...prefill };
  const hadValue = { ...prefill };   // a prefilled field cleared by the user means CLEAR, not "no change"

  for (const f of spec.fields) {
    const wrap = $(`<label class="${f.required?'req':''}"><b>${f.label}</b><i>${f.hint||''}</i></label>`);
    let el;
    if (f.widget === 'lines') {
      el = linesEditor(f, state);
    } else if (f.widget === 'lookup' || f.widget === 'select') {
      el = document.createElement('select');
      el.append(new Option(f.required ? '— choose —' : '— none —', ''));
      for (const o of (f.widget === 'lookup' ? (REG.lookups[f.entity]||[]) : f.options.map(v=>({id:v,label:v}))))
        el.append(new Option(o.label + (o.label !== o.id ? `  (${o.id})` : ''), o.id));
      el.value = state[f.key] ?? '';
      el.onchange = () => state[f.key] = el.value || undefined;
    } else if (f.widget === 'checkbox') {
      el = Object.assign(document.createElement('input'), { type:'checkbox', checked: state[f.key] !== false });
      el.style.width = 'auto'; el.onchange = () => state[f.key] = el.checked;
    } else {
      el = document.createElement(f.widget === 'textarea' ? 'textarea' : 'input');
      if (f.widget === 'date') el.type = 'date';
      /* money is entered in dollars and sent in cents — the conversion lives here, once,
         because the field declared itself as money. */
      if (f.widget === 'money') { el.placeholder = '0.00'; el.inputMode = 'decimal'; }
      if (f.widget === 'number') el.type = 'number';
      el.value = state[f.key] == null ? '' : (f.widget === 'money' ? (state[f.key] / 100).toFixed(2) : state[f.key]);
      el.oninput = () => {
        const v = el.value.trim();
        state[f.key] = v === ''
          ? ((hadValue[f.key] !== undefined && f.widget !== 'money' && f.widget !== 'number') ? '' : undefined)
          : f.widget === 'money' ? Math.round(parseFloat(v) * 100)
          : f.widget === 'number' ? parseInt(v, 10) : v;
      };
    }
    wrap.append(el); form.append(wrap);
  }
  const why = $(`<label><b>Reason <i style="display:inline">(optional — goes into the audit trail)</i></b></label>`);
  const whyIn = document.createElement('input'); whyIn.oninput = () => state._reason = whyIn.value || undefined;
  why.append(whyIn); form.append(why);

  const err = $('<div class="err" hidden></div>');
  const foot = $('<footer></footer>');
  const cancel = $('<button type="button">Cancel</button>'); cancel.onclick = () => dlg.close();
  const go = $(`<button class="primary" type="button">${spec.title}</button>`);
  go.onclick = async () => {
    err.hidden = true; go.disabled = true;
    try { await api(spec.name, state); dlg.close(); toast(`✓ ${spec.title} — done, logged`); render(); }
    catch (e) { err.textContent = e.message; err.hidden = false; }   /* the refusal, verbatim */
    finally { go.disabled = false; }
  };
  foot.append(cancel, go); dlg.append(form, err, foot); dlg.showModal();
}

function linesEditor(f, state) {
  const box = document.createElement('div'); const rows = state[f.key] ? [...state[f.key]] : [];
  const sync = () => state[f.key] = rows.filter(r => r.item_id || r.order_line_id);
  const draw = () => {
    box.innerHTML = '';
    const t = $('<table class="lines"><thead><tr>' + f.of.map(c=>`<th>${c.label}</th>`).join('') + '<th></th></tr></thead><tbody></tbody></table>');
    const tb = t.querySelector('tbody');
    rows.forEach((row, i) => {
      const tr = document.createElement('tr');
      for (const c of f.of) {
        const td = document.createElement('td'); let el;
        if (c.widget === 'lookup') {
          el = document.createElement('select'); el.append(new Option('—',''));
          for (const o of REG.lookups[c.entity]||[]) el.append(new Option(o.label, o.id));
        } else { el = document.createElement('input'); el.type = 'number'; }
        el.value = row[c.key] ?? '';
        el.onchange = el.oninput = () => { row[c.key] = el.value === '' ? undefined : (c.widget === 'lookup' ? el.value : parseInt(el.value,10)); sync(); };
        td.append(el); tr.append(td);
      }
      const x = $('<td><button type="button">×</button></td>');
      x.querySelector('button').onclick = () => { rows.splice(i,1); sync(); draw(); };
      tr.append(x); tb.append(tr);
    });
    const add = $('<button type="button" style="margin-top:8px">+ line</button>');
    add.onclick = () => { rows.push({}); sync(); draw(); };
    box.append(t, add);
  };
  draw(); return box;
}

/* ---------- views ---------- */
const cmd = (n) => REG.commands.find(c => c.name === n);
/* A fresh solo space teaches: connecting Claude IS the product — the agent guides from there. */
function soloOnboarding() {
  const card = $(`<div class="card" style="max-width:660px;margin-top:6px">
    <h2 style="margin-bottom:6px">Your first invoice</h2>
    <div style="display:flex;gap:12px;margin-top:14px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">1</div>
      <div><b>Mint a key for your agent</b>
      <div class="doc" style="margin-top:2px">Open <b id="soShare" style="color:var(--accent);cursor:pointer">Share this space…</b> — second row, type <i>claude</i>, leave <b>controller</b>, press <b>Mint key</b>, copy the connector URL. The link IS the key: treat it like a password, revoke it there any time.</div></div></div>
    <div style="display:flex;gap:12px;margin-top:16px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">2</div>
      <div><b>Add it to Claude</b>
      <div class="doc" style="margin-top:2px"><b>Settings → Connectors → Add custom connector</b> — Name: <b>books</b> · Remote MCP server URL: <b>the link you copied</b>.</div></div></div>
    <div style="display:flex;gap:12px;margin-top:16px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">3</div>
      <div><b>Open a new session and say:</b> <a id="soCopy" style="color:var(--accent);cursor:pointer;font-weight:400">(copy)</a>
      <div id="soPrompt" style="margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12px/1.55 var(--mono);white-space:pre-wrap">Let's create an invoice.</div>
      <div class="doc" style="margin-top:6px">That's genuinely all. The agent knows this space's rules — it will ask for your company details one question at a time, then your client, then the work you're billing, show you every number, and hand back a document link to send. Prefer forms? <b>Company</b> (under System) and <b>New client</b> here do the same, and the agent picks up whatever you've already filled in.</div></div></div>
  </div>`);
  card.querySelector('#soShare').onclick = () => document.getElementById('inviteBtn')?.click();
  card.querySelector('#soCopy').onclick = () => navigator.clipboard.writeText(card.querySelector('#soPrompt').textContent).then(
    () => toast('✓ copied'), () => toast('✗ copy failed'));
  return card;
}

/* A fresh hunt space teaches instead of showing bare table headers. */
function huntOnboarding() {
  const card = $(`<div class="card" style="max-width:660px;margin-top:6px">
    <h2 style="margin-bottom:6px">Start your hunt</h2>
    <div style="display:flex;gap:12px;margin-top:14px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">1</div>
      <div><b>Mint a key for your agent</b>
      <div class="doc" style="margin-top:2px">Open <b id="obShare" style="color:var(--accent);cursor:pointer">Share this space…</b> (also in the sidebar). In the <b>second row</b>, type a name for your agent — <i>claude</i> works — leave the role on <b>controller</b>, and press <b>Mint key</b>. A link appears in the member list, like <span style="font-family:var(--mono);font-size:11.5px">https://saybooks.io/mcp/m-…</span> — copy it. That link IS the key: whoever holds it acts as your delegate, so treat it like a password (you can revoke it there any time).</div></div></div>
    <div style="display:flex;gap:12px;margin-top:16px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">2</div>
      <div><b>Add it to Claude</b>
      <div class="doc" style="margin-top:2px">In the Claude app: <b>Settings → Connectors → Add custom connector</b>. Name: <b>hunt</b> · Remote MCP server URL: <b>the link you copied</b>. Continue.</div></div></div>
    <div style="display:flex;gap:12px;margin-top:16px"><div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:26px;font-weight:700">3</div>
      <div><b>Open a new session and paste this</b> <a id="obCopy" style="color:var(--accent);cursor:pointer;font-weight:400">(copy)</a>
      <div id="obPrompt" style="margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12px/1.55 var(--mono);white-space:pre-wrap">You're my job-hunt assistant, connected to my Saybooks hunt space through the "hunt" connector. Call core_schema first to learn the rules. Then log the posting below: evaluate the fit, run the duplicate check, and give me one next action with a due date.</div>
      <div class="doc" style="margin-top:4px">…with a job description pasted underneath. From then on, just talk: <i>"the recruiter called, interview Thursday"</i>, <i>"TCS ghosted me"</i>, <i>"what's due today?"</i> Everything it records shows up here — and it can never invent a date or a name, the guard flags the same req retitled by another agency, and it all lands in the <a data-v="audit" style="color:var(--accent);cursor:pointer">audit trail</a>. Export or delete everything any time, bottom of the sidebar. <span style="color:var(--dim)">(Claude Code instead? <span style="font-family:var(--mono);font-size:11px">claude mcp add hunt -t http &lt;your link&gt;</span>)</span></div></div></div>
  </div>`);
  card.querySelector('#obShare').onclick = () => document.getElementById('inviteBtn')?.click();
  card.querySelector('[data-v="audit"]').onclick = () => { view = 'audit'; render(); };
  card.querySelector('#obCopy').onclick = () => {
    navigator.clipboard.writeText(card.querySelector('#obPrompt').textContent).then(
      () => toast('✓ starter prompt copied'), () => toast('✗ copy failed — select and copy by hand'));
  };
  return card;
}

const buttonFor = (c) => {
  const allowed = !REG.grants || REG.grants.includes(c.permission);
  const b = $(`<button class="primary" ${allowed ? '' : 'disabled'}>${c.title}</button>`);
  if (!allowed) b.title = `${c.title} needs ${c.permission} — your role (${REG.member ? REG.member.role : 'viewer'}) does not have it.`;
  b.onclick = () => openForm(c);
  return b;
};
const newButtons = (subject) => REG.commands.filter(c => c.subject === subject && c.intent === 'write' && c.scope === 'collection')
  .map(buttonFor);

async function detail(type, id) {
  const wrap = $('<div></div>');
  const idArg = type === 'solo_invoice' ? 'invoice_id' : type + '_id';
  const [entity, na] = await Promise.all([
    api({ order:'o2c_get_order', customer:'o2c_get_customer', invoice:'o2c_get_invoice', account:'crm_get_account', campaign:'crm_get_campaign', posting:'hunt_get_posting', contact:'hunt_get_contact', resume:'hunt_get_resume', solo_invoice:'solo_get_invoice' }[type],
        { [idArg]: id }),
    fetch(wsUrl(`/api/next-actions?type=${type}&id=${id}`)).then(r => r.json()),
  ]);
  const card = $('<div class="card"></div>');
  card.append($(`<h2>${entity.name ? `${entity.name} <span style="color:var(--dim);font-weight:400;font-size:15px">${id}</span>` : id} <span class="pill ${entity.stage || entity.status || ''}">${entity.stage || entity.status || ''}</span></h2>`));
  const kv = $('<div class="kv"></div>');
  const facts = type === 'order'
    ? { Customer: entity.customer_name, PO: entity.po_ref||'—', Total: entity.total_display, 'Open qty': entity.open_qty, 'Uninvoiced qty': entity.uninvoiced_qty, Quote: entity.quote_id||'—' }
    : type === 'customer'
    ? { Terms: entity.terms, 'Credit limit': entity.credit_limit_display, 'Open AR': entity.open_balance_display, Committed: entity.committed_display, Available: entity.credit_available_display }
    : type === 'account'
    ? { Campaign: entity.campaign_name ?? '—', Tier: entity.tier ?? '—', Vertical: entity.vertical ?? '—', Trigger: entity.trigger_event ?? '—', Customer: entity.customer_id ?? '— (not promoted)', 'Open gaps': entity.gap_count, Reason: entity.status_reason ?? '—' }
    : type === 'posting'
    ? { Via: entity.company_name, 'End client': entity.end_client_name ?? '—', Req: entity.req_id ?? '—', Fit: entity.fit_score ?? '—', Resume: entity.resume_version_label ?? '—', 'Applied': entity.application ? (entity.application.applied_at || 'yes') : 'no', 'App status': entity.application ? entity.application.status : '—' }
    : type === 'solo_invoice'
    ? { Client: entity.customer_name, Total: entity.total_display, Applied: entity.applied_display, Open: entity.open_display, Issued: entity.issued_at ?? '— (draft)', Due: entity.due_at ?? `${entity.due_in_days ?? 30} days from issue`, ...(entity.void_reason && { Voided: entity.void_reason }) }
    : type === 'contact'
    ? { Company: entity.company_name ?? '—', Role: entity.role ?? '—', Email: entity.email ?? '—', Phone: entity.phone ?? '—', LinkedIn: entity.linkedin_url ? `<a href="${entity.linkedin_url}" target="_blank" rel="noopener">profile</a>` : '—', Source: entity.source, 'Last touch': entity.last_touch ? entity.last_touch.slice(0,10) : '—' }
    : type === 'resume'
    ? { Headline: entity.headline ?? '—', Platform: entity.platform ?? '—', Focus: entity.focus ?? '—', File: entity.file_path ?? '—', Applications: entity.applications.length, Registered: (entity.created_at||'').slice(0,10) }
    : type === 'campaign'
    ? { 'Open gaps': entity.open_gaps, 'Going stale': entity.stale_14d, Reason: entity.status_reason ?? '—', ...Object.fromEntries(Object.entries(entity.accounts_by_status).map(([k, v]) => [k, v])) }
    : { Customer: entity.customer_id, Order: entity.order_id, Total: entity.total_display, Applied: entity.applied_display, Open: entity.open_display, Due: entity.due_at };
  for (const [k, v] of Object.entries(facts)) kv.append($(`<div><span>${k}</span>${v}</div>`));
  card.append(kv);

  /* Buttons and their disabled reasons come from the server's guard evaluation — the same
     call core_next_actions makes. The browser decides nothing about what is allowed.
     Forms open PREFILLED from the entity: the commands are patch-semantics for agents, but a
     person expects an update form to show what is currently there. */
  const prefillFor = (c) => {
    const p = { [idArg]: id };
    for (const f2 of c.fields) {
      if (f2.key in p) continue;
      if (f2.widget === 'lines') {
        const src = f2.key === 'bullets' ? (entity.path_in || []).map(x => ({ bullet: x.bullet })) : entity[f2.key];
        if (Array.isArray(src) && src.length) p[f2.key] = src.map(row => Object.fromEntries(f2.of.map(cc => [cc.key, row[cc.key]]).filter(([, v]) => v !== undefined && v !== null)));
        continue;
      }
      const v = entity[f2.key];
      if (v !== undefined && v !== null) p[f2.key] = v;
    }
    return p;
  };
  const acts = $('<div class="acts"></div>');
  for (const a of na.actions) {
    const b = $(`<button ${a.available ? '' : 'disabled'}>${a.title}</button>`);
    if (!a.available) b.title = a.reason;
    b.onclick = () => openForm(cmd(a.command), prefillFor(cmd(a.command)));
    acts.append(b);
  }
  card.append(acts);
  /* A posting's application is a subject of its own (move along, add interview, correct the
     record) — its buttons come from the same server-side guard evaluation, on its own row. */
  if (type === 'posting' && entity.application) {
    const naApp = await fetch(wsUrl(`/api/next-actions?type=application&id=${entity.application.id}`)).then(r => r.json());
    if (naApp.actions && naApp.actions.length) {
      const acts2 = $(`<div class="acts" style="margin-top:6px"><span style="font-size:12px;color:var(--dim);align-self:center">${entity.application.id}:</span></div>`);
      for (const a of naApp.actions) {
        const b = $(`<button ${a.available ? '' : 'disabled'}>${a.title}</button>`);
        if (!a.available) b.title = a.reason;
        b.onclick = () => {
          const spec2 = cmd(a.command);
          const p = { application_id: entity.application.id };
          for (const f2 of spec2.fields) { const v = entity.application[f2.key]; if (!(f2.key in p) && v !== undefined && v !== null) p[f2.key] = v; }
          openForm(spec2, p);
        };
        acts2.append(b);
      }
      card.append(acts2);
    }
  }
  wrap.append(card);

  if (type === 'posting') {
    /* Prose blocks: real line breaks and paragraphs are respected; a text stored as one
       solid block falls back to a line per sentence (the text itself is untouched —
       display wrapping only). The guard list keeps "incl. BTP" and friends whole. */
    const fmtDoc = (s) => {
      const e = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\r/g, '');
      if (/\n/.test(e)) return e.split(/\n{2,}/).map(p => `<p style="margin:0 0 8px">${p.replace(/\n/g, '<br>')}</p>`).join('');
      return e.replace(/(?<!\b(?:incl|approx|etc|e\.g|i\.e|vs|min|max|resp))\.\s+(?=[A-Z0-9"(])/g, '.<br>');
    };
    if (entity.fit_notes || entity.jd_text || entity.red_flags) wrap.append($(`<div class="card">
      ${entity.fit_notes ? `<b>Fit</b><div class="doc" style="margin-top:4px;line-height:1.55">${fmtDoc(entity.fit_notes)}</div>` : ''}
      ${entity.red_flags ? `<div style="margin-top:8px"><b style="color:var(--warn)">Red flags</b><div class="doc" style="line-height:1.55">${fmtDoc(entity.red_flags)}</div></div>` : ''}
      ${entity.skip_reason ? `<div style="margin-top:8px"><b>Skipped because</b><div class="doc">${entity.skip_reason}</div></div>` : ''}
      ${entity.open_next_action ? `<div style="margin-top:8px"><b style="color:var(--accent)">Open next action</b><div class="doc">${entity.open_next_action}</div></div>` : ''}
      ${entity.jd_text ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;font-size:13.5px">Job description — verbatim, as posted</summary>
        <div class="doc" style="margin-top:6px;line-height:1.6">${fmtDoc(entity.jd_text)}</div></details>` : ''}</div>`));
    if (entity.application && entity.application.interviews.length) {
      const it2 = $('<table><thead><tr><th>Round</th><th>Kind</th><th>When</th><th>Interviewer</th><th>Outcome</th></tr></thead><tbody></tbody></table>');
      for (const iv of entity.application.interviews) it2.querySelector('tbody').append($(`<tr><td>${iv.round||''}</td><td>${iv.kind||''}</td><td>${iv.scheduled_at||''}</td><td>${iv.interviewer||''}</td><td><span class="pill">${iv.outcome}</span></td></tr>`));
      wrap.append($('<div class="sub" style="margin-top:16px">Interviews</div>'), it2);
    }
    if (entity.interactions.length) {
      const xt = $('<table><thead><tr><th>At</th><th>Dir</th><th>Summary</th><th>Next action</th></tr></thead><tbody></tbody></table>');
      for (const x of entity.interactions) xt.querySelector('tbody').append($(`<tr><td>${(x.at||'').slice(0,16).replace('T',' ')}</td><td>${x.direction}</td><td>${x.summary}</td>
        <td style="font-size:12px;color:${x.next_action_state==='open'?'var(--accent)':'var(--dim)'}">${x.next_action ? x.next_action + ' [' + x.next_action_state + ']' : ''}</td></tr>`));
      wrap.append($('<div class="sub" style="margin-top:16px">Touches — superseded intentions kept</div>'), xt);
    }
  }
  if (type === 'contact') {
    if (entity.notes) wrap.append($(`<div class="card"><b>Notes</b><div class="doc" style="margin-top:4px">${entity.notes}</div></div>`));
    if (entity.postings.length) {
      const pt = $('<table><thead><tr><th>Posting</th><th>Title</th><th>Via</th><th>Posting</th><th>Application</th></tr></thead><tbody></tbody></table>');
      for (const r of entity.postings) {
        const tr = $(`<tr><td>${r.id}</td><td>${r.title}</td><td>${r.company_name}</td><td><span class="pill ${r.posting_status}">${r.posting_status}</span></td><td>${r.app_status ? `<span class="pill ${r.app_status}">${r.app_status}</span>` : '—'}</td></tr>`);
        tr.onclick = () => { selected = { type: 'posting', id: r.id }; render(); };
        pt.querySelector('tbody').append(tr);
      }
      wrap.append($('<div class="sub" style="margin-top:16px">Postings this person touches</div>'), pt);
    }
    if (entity.interactions.length) {
      const xt = $('<table><thead><tr><th>At</th><th>Dir</th><th>Posting</th><th>Summary</th><th>Next action</th></tr></thead><tbody></tbody></table>');
      for (const x of entity.interactions) {
        const tr = $(`<tr><td>${(x.at||'').slice(0,16).replace('T',' ')}</td><td>${x.direction}</td><td style="font-size:12px">${x.posting_id ? `${x.posting_id} · ${x.title ?? ''}` : ''}</td><td>${x.summary}</td>
          <td style="font-size:12px;color:${x.next_action_state==='open'?'var(--accent)':'var(--dim)'}">${x.next_action ? x.next_action + ' [' + x.next_action_state + ']' : ''}</td></tr>`);
        if (x.posting_id) tr.onclick = () => { selected = { type: 'posting', id: x.posting_id }; render(); }; else tr.style.cursor = 'default';
        xt.querySelector('tbody').append(tr);
      }
      wrap.append($('<div class="sub" style="margin-top:16px">Touches</div>'), xt);
    }
  }
  if (type === 'resume') {
    if (entity.notes) wrap.append($(`<div class="card"><b>Notes</b><div class="doc" style="margin-top:4px">${entity.notes}</div></div>`));
    if (entity.applications.length) {
      const at3 = $('<table><thead><tr><th>Application</th><th>Posting</th><th>Title</th><th>Via</th><th>Applied</th><th>Status</th></tr></thead><tbody></tbody></table>');
      for (const r of entity.applications) {
        const tr = $(`<tr><td>${r.id}</td><td>${r.posting_id}</td><td>${r.title}</td><td>${r.company_name}</td><td style="font-size:12px">${r.applied_at ?? ''}</td><td><span class="pill ${r.status}">${r.status}</span></td></tr>`);
        tr.onclick = () => { selected = { type: 'posting', id: r.posting_id }; render(); };
        at3.querySelector('tbody').append(tr);
      }
      wrap.append($('<div class="sub" style="margin-top:16px">Went out on — one answer to "the resume you sent" (JH-10)</div>'), at3);
    }
    if (entity.planned.length) {
      const et = $('<table><thead><tr><th>Posting</th><th>Title</th><th>Via</th><th>Status</th></tr></thead><tbody></tbody></table>');
      for (const r of entity.planned) {
        const tr = $(`<tr><td>${r.id}</td><td>${r.title}</td><td>${r.company_name}</td><td><span class="pill ${r.posting_status}">${r.posting_status}</span></td></tr>`);
        tr.onclick = () => { selected = { type: 'posting', id: r.id }; render(); };
        et.querySelector('tbody').append(tr);
      }
      wrap.append($('<div class="sub" style="margin-top:16px">Earmarked — chosen for the posting, not yet applied</div>'), et);
    }
  }
  if (type === 'campaign') {
    wrap.append($(`<div class="card"><b>Goal — the brief agents read</b><div class="doc" style="margin-top:4px">${entity.goal}</div>
      ${entity.target_profile ? `<div style="margin-top:8px"><b>Target profile</b><div class="doc">${entity.target_profile}</div></div>` : ''}</div>`));
    const rows = (await api('crm_pipeline', { campaign_id: id }));
    if (rows.length) {
      const t = $('<table><thead><tr><th>Account</th><th>Name</th><th>Tier</th><th>Status</th><th class="num">P</th></tr></thead><tbody></tbody></table>');
      for (const r of rows) {
        const tr = $(`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.tier ?? ''}</td><td><span class="pill ${r.status}">${r.status}</span></td><td class="num">${Math.round(r.probability * 100)}%</td></tr>`);
        tr.dataset.search = Object.values(r).filter(v => v != null && typeof v !== 'object').join(' ');
        tr.onclick = () => { selected = { type: 'account', id: r.id }; render(); };
        t.querySelector('tbody').append(tr);
      }
      wrap.append($('<div class="sub" style="margin-top:16px">Accounts in this campaign</div>'), t);
    }
  }
  if (type === 'account') {
    wrap.append($(`<div class="card"><b>Why them</b><div class="doc" style="margin-top:4px">${entity.why_them}</div>
      ${entity.hook ? `<div style="margin-top:8px"><b>Hook</b><div class="doc">${entity.hook}</div></div>` : ''}
      <div style="margin-top:8px;font-size:12px"><a href="${entity.source_url}" target="_blank" rel="noopener">source</a></div>
      ${entity.path_in.length ? `<div style="margin-top:10px"><b>Path in</b><ol style="margin:4px 0 0;padding-left:1.4em;font-size:13.5px">${entity.path_in.map(p2 => `<li>${p2.bullet}</li>`).join('')}</ol></div>` : ''}</div>`));
    const ct = $('<table><thead><tr><th>Contact</th><th>Role</th><th>Name / gap</th><th>Source</th><th>Reach</th><th>Confidence</th><th></th></tr></thead><tbody></tbody></table>');
    for (const c of entity.contacts) {
      const tr = $(
      `<tr><td>${c.id}</td><td>${c.role_type}</td>
       <td>${c.status === 'gap' ? `<span class="pill" style="background:var(--alert);color:var(--warn)">gap</span> <span style="color:var(--dim);font-size:12.5px">${c.gap_note}</span>` : `${c.name}${c.title ? ' · ' + c.title : ''}${c.status === 'departed' ? ' <span class="pill">departed</span>' : ''}`}</td>
       <td style="font-size:12px">${c.source ? `<a href="${c.source}" target="_blank" rel="noopener">link</a>` : ''}</td>
       <td style="font-size:12px;white-space:nowrap">${[c.linkedin_url ? `<a href="${c.linkedin_url}" target="_blank" rel="noopener">profile</a>` : '', c.email ? `<a href="mailto:${c.email}">${c.email}</a>` : '', c.phone || '', c.linkedin_path || '', c.mutual_via ? `via ${c.mutual_via}` : ''].filter(Boolean).join(' · ')}</td>
       <td style="font-size:12px;color:var(--dim)">${c.confidence_note || ''}</td><td></td></tr>`);
      const btn = $(`<button style="font-size:11px;padding:3px 9px">${c.status === 'gap' ? 'Resolve' : 'Edit'}</button>`);
      btn.onclick = () => {
        const spec2 = cmd(c.status === 'gap' ? 'crm_resolve_gap' : 'crm_update_contact');
        const p = { contact_id: c.id };
        for (const f2 of spec2.fields) if (!(f2.key in p) && c[f2.key] !== undefined && c[f2.key] !== null) p[f2.key] = c[f2.key];
        openForm(spec2, p);
      };
      tr.lastElementChild.append(btn);
      ct.querySelector('tbody').append(tr);
    }
    wrap.append($('<div class="sub" style="margin-top:16px">Contacts — gaps are findings, not blanks</div>'), ct);
    if (entity.activity.length) {
      const at2 = $('<table><thead><tr><th>Occurred</th><th>Medium</th><th>Summary</th></tr></thead><tbody></tbody></table>');
      for (const x of entity.activity) at2.querySelector('tbody').append($(`<tr><td>${x.occurred_at}</td><td>${x.medium || ''}</td><td>${x.summary}</td></tr>`));
      wrap.append($('<div class="sub" style="margin-top:16px">Activity — dated when it happened, not when it was typed</div>'), at2);
    }
  }
  if (type === 'invoice') {
    const bar = $('<div class="acts" style="margin:2px 0 14px"></div>');
    const b = $('<button class="primary">Document — print / save PDF</button>');
    b.onclick = () => invoiceDoc(entity);
    bar.append(b); wrap.append(bar);
    if (!entity.seller) wrap.append($('<div class="card doc" style="color:var(--warn)">No company profile yet — the document prints without a seller block. Set it under Customers → Company profile.</div>'));
  }
  if (type === 'solo_invoice') {
    const bar2 = $('<div class="acts" style="margin:2px 0 14px"></div>');
    if (entity.doc_path) {
      const b = $('<button class="primary">Document — print / save PDF</button>');
      b.onclick = () => window.open(entity.doc_path, '_blank');
      const cp = $('<button>Copy client link</button>');
      cp.onclick = () => navigator.clipboard.writeText(location.origin + entity.doc_path).then(() => toast('✓ link copied — send it to your client'));
      bar2.append(b, cp);
    } else if (entity.status === 'draft') {
      bar2.append($('<span class="sub" style="margin:0;align-self:center">Issuing freezes the numbers and mints the shareable document link.</span>'));
    }
    wrap.append(bar2);
    const lt = $('<table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Tax</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    for (const l of entity.lines) lt.querySelector('tbody').append($(
      `<tr><td>${l.description}</td><td class="num">${l.qty}</td><td class="num">${cents(l.rate)}</td><td class="num">${l.tax_rate_bp ? (l.tax_rate_bp / 100).toFixed(2) + '%' : '—'}</td><td class="num">${cents(l.amount)}</td></tr>`));
    wrap.append(lt);
    if (entity.notes) wrap.append($(`<div class="card doc" style="margin-top:10px">${entity.notes}</div>`));
  }
  if (entity.lines && type !== 'solo_invoice') {
    const t = $('<table><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Shipped</th><th class="num">Invoiced</th><th class="num">Price</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    for (const l of entity.lines) t.querySelector('tbody').append($(
      `<tr><td>${l.id}</td><td>${l.item_name}</td><td class="num">${l.qty}</td><td class="num">${l.qty_shipped ?? '—'}</td><td class="num">${l.qty_invoiced ?? '—'}</td><td class="num">${cents(l.unit_price)}</td><td class="num">${cents(l.qty*l.unit_price)}</td></tr>`));
    wrap.append(t);
  }
  const trail = await fetch(wsUrl(`/api/cmd/core_audit`), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ subject_id:id, limit:20 }) }).then(r=>r.json());
  wrap.append($('<div class="sub" style="margin-top:20px">History</div>'), auditTable(trail.result));
  return wrap;
}

/* Bank CSV import: parsing and matching happen here for preview, but every recorded row goes
   through o2c_record_payment individually — same choke point, same log, refusals surfaced. */
function bankImportDialog() {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '';
  const box = $(`<div style="min-width:720px;max-width:900px"><h2>Import bank CSV</h2>
    <div class="doc" style="margin-bottom:10px">Paste rows from your bank export. Each row becomes its own <b>Record payment</b> — individually logged, refusals shown. Outflows and unmatched payers are skipped, never guessed (matching a payment to an invoice stays a separate act).</div>
    <textarea rows="7" style="width:100%;font:12px var(--mono)" placeholder="Date,Amount,Payer,Reference&#10;2026-08-20,1250.00,Northwind Traders,WIRE-4471"></textarea>
    <div class="acts" style="margin-top:10px"><button class="primary">Preview</button><button value="cancel">Close</button></div>
    <div class="stage"></div></div>`);
  const ta = box.querySelector('textarea'), stage = box.querySelector('.stage');
  const [prevBtn, closeBtn] = box.querySelectorAll('.acts button');
  closeBtn.onclick = () => dlg.close();

  const parse = (text) => {
    const first = text.split(/\r?\n/).find(l => l.trim());
    const delim = [',', ';', '\t'].map(d => [d, (first.match(new RegExp('\\' + d, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (cur.trim() !== '' || row.length) { row.push(cur.trim()); rows.push(row); } row = []; cur = ''; }
      else cur += ch;
    }
    if (cur.trim() !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
    return rows.filter(r => r.some(c => c !== ''));
  };
  const centsOf = (s) => {
    let v = String(s || '').replace(/[$\s]/g, '');
    if (/,\d{2}$/.test(v) && !v.includes('.')) v = v.replace(',', '.');
    v = v.replace(/,/g, '');
    const f = parseFloat(v);
    return Number.isFinite(f) ? Math.round(f * 100) : null;
  };
  const isoOf = (s) => {
    const v = String(s || '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    const m = v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    return m ? `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : null;
  };

  prevBtn.onclick = () => {
    const all = parse(ta.value);
    if (!all.length) { stage.innerHTML = '<div class="doc" style="color:var(--warn)">Nothing to parse.</div>'; return; }
    const looksHeader = all[0].every(c => centsOf(c) === null || /[a-z]{3,}/i.test(c)) && all.length > 1;
    const header = looksHeader ? all[0] : all[0].map((_, i) => 'column ' + (i + 1));
    const data = looksHeader ? all.slice(1) : all;
    const guess = (re) => { const i = header.findIndex(h => re.test(h)); return i >= 0 ? i : null; };
    const map = {
      date: guess(/date|posted|booking/i) ?? 0,
      amount: guess(/amount|value|credit|sum/i) ?? 1,
      payer: guess(/payer|name|description|counterparty|from|detail/i) ?? 2,
      reference: guess(/ref|memo|note|id/i) ?? 3,
    };
    stage.innerHTML = '';
    const mapRow = $('<div class="acts" style="margin:10px 0;align-items:center;flex-wrap:wrap"></div>');
    const sel = {};
    for (const k of ['date', 'amount', 'payer', 'reference']) {
      const s2 = $(`<select>${header.map((h, i) => `<option value="${i}" ${i === map[k] ? 'selected' : ''}>${h}</option>`).join('')}</select>`);
      sel[k] = s2; mapRow.append($(`<span class="sub" style="margin:0">${k}</span>`), s2);
    }
    const methodSel = $('<select><option>ach</option><option>wire</option><option>check</option><option>card</option></select>');
    mapRow.append($('<span class="sub" style="margin:0">method</span>'), methodSel);
    const rebuild = $('<button>Re-match</button>'); mapRow.append(rebuild);
    stage.append(mapRow);

    const custs = (REG.lookups && REG.lookups.customer) || [];
    const matchOf = (payer) => {
      const p = payer.toLowerCase();
      return custs.find(c => p.includes(c.name.toLowerCase()) || c.name.toLowerCase().includes(p)) || null;
    };
    const tblBox = $('<div style="max-height:320px;overflow-y:auto;margin-top:6px"></div>');
    stage.append(tblBox);
    const runRow = $('<div class="acts" style="margin-top:10px"></div>');
    const runBtn = $('<button class="primary">Record payments</button>'); runRow.append(runBtn);
    const out = $('<div class="doc" style="margin-top:8px"></div>'); stage.append(runRow, out);

    let items = [];
    const buildTable = () => {
      items = data.map(r => {
        const amount = centsOf(r[+sel.amount.value]);
        const date = isoOf(r[+sel.date.value]);
        const payer = r[+sel.payer.value] || '';
        return { amount, date, payer, reference: r[+sel.reference.value] || '', customer: matchOf(payer), skip: amount === null || amount <= 0 };
      });
      const t = $('<table><thead><tr><th>Date</th><th>Payer (as printed)</th><th>Customer</th><th>Ref</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody></tbody></table>');
      items.forEach((it) => {
        const cs = $(`<select><option value="">— skip —</option>${custs.map(c => `<option value="${c.id}" ${it.customer && it.customer.id === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`);
        cs.onchange = () => { it.customer = custs.find(c => c.id === cs.value) || null; };
        const tr = $(`<tr><td>${it.date || '<span style="color:var(--warn)">?</span>'}</td><td style="font-size:12px">${it.payer}</td><td></td>
          <td style="font-size:12px">${it.reference}</td><td class="num">${it.amount != null ? cents(it.amount) : '?'}</td>
          <td class="st" style="font-size:12px;color:var(--dim)">${it.skip ? (it.amount != null && it.amount <= 0 ? 'outflow — skipped' : 'bad amount — skipped') : (it.customer ? 'ready' : 'no match — pick or skip')}</td></tr>`);
        tr.children[2].append(cs); it._tr = tr;
        t.querySelector('tbody').append(tr);
      });
      tblBox.innerHTML = ''; tblBox.append(t);
    };
    rebuild.onclick = buildTable;
    buildTable();

    runBtn.onclick = async () => {
      runBtn.disabled = true;
      let ok = 0, skipped = 0, refused = 0;
      for (const it of items) {
        const st = it._tr.querySelector('.st');
        if (it.skip || !it.customer) { skipped++; continue; }
        try {
          const r = await api('o2c_record_payment', { customer_id: it.customer.id, amount: it.amount,
            method: methodSel.value, reference: it.reference || undefined, received_at: it.date || undefined });
          ok++; st.textContent = `recorded ${r.id}`; st.style.color = 'var(--accent)';
        } catch (e) { refused++; st.textContent = e.message; st.style.color = 'var(--warn)'; }
      }
      out.textContent = `${ok} recorded as unapplied cash, ${skipped} skipped, ${refused} refused. Every recorded row is in the audit trail; apply them to invoices from this page.`;
      runBtn.textContent = 'Done — close to refresh'; closeBtn.onclick = () => { dlg.close(); render(); };
    };
  };
  dlg.append(box); dlg.showModal();
}

/* The document is a READ rendered for paper (INV-22): the system produces it; sending it to
   the customer is the operator's act, outside the system, on purpose. */
function invoiceDoc(inv) {
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const nl = (s) => esc(s).replace(/\n/g, '<br>');
  const s = inv.seller;
  const rows = inv.lines.map(l => `<tr><td>${esc(l.item_name)}</td><td class="n">${l.qty}</td><td class="n">${cents(l.unit_price)}</td>
    <td class="n">${l.tax_rate_bp ? (l.tax_rate_bp / 100).toFixed(2) + '%' : '—'}</td><td class="n">${cents(l.qty * l.unit_price)}</td></tr>`).join('');
  const w = window.open('', '_blank');
  w.document.write(`<!doctype html><html><head><title>${esc(inv.id)}</title><style>
    body{font:14px/1.5 Georgia,serif;color:#1a1a1a;max-width:52em;margin:3em auto;padding:0 2em}
    .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2.5em}
    h1{font-size:26px;letter-spacing:.04em;margin:0} .muted{color:#666;font-size:12.5px}
    table{width:100%;border-collapse:collapse;margin:1.5em 0} th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666;border-bottom:1px solid #1a1a1a;padding:6px 8px}
    td{padding:7px 8px;border-bottom:1px solid #ddd} .n{text-align:right}
    .totals{margin-left:auto;width:20em} .totals td{border:none;padding:3px 8px} .totals .due td{border-top:1px solid #1a1a1a;font-weight:700}
    .pay{border:1px solid #ccc;padding:.9em 1.1em;margin-top:2em;font-size:13px}
    .foot{margin-top:2.5em;font-size:12px;color:#666}
    .bar{margin-bottom:2em} @media print{.bar{display:none}}
  </style></head><body>
    <div class="bar"><button onclick="window.print()">Print / Save as PDF</button></div>
    <div class="top">
      <div>${s ? `<div style="font-size:19px;font-weight:700">${esc(s.name)}</div><div class="muted">${nl(s.address || '')}${s.tax_id ? '<br>Tax ID ' + esc(s.tax_id) : ''}</div>` : ''}</div>
      <div style="text-align:right"><h1>INVOICE</h1><div class="muted">${esc(inv.id)}<br>Issued ${esc(inv.issued_at)}<br>Due ${esc(inv.due_at)} · ${esc(inv.terms || '')}${inv.po_ref ? '<br>Your PO: ' + esc(inv.po_ref) : ''}</div></div>
    </div>
    <div class="muted" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Bill to</div>
    <div style="font-weight:700">${esc(inv.customer_name)}</div>${inv.customer_email ? `<div class="muted">${esc(inv.customer_email)}</div>` : ''}
    <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Tax</th><th class="n">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <table class="totals">
      <tr><td>Subtotal</td><td class="n">${cents(inv.total - inv.tax_total)}</td></tr>
      <tr><td>Tax</td><td class="n">${cents(inv.tax_total)}</td></tr>
      <tr><td>Total</td><td class="n">${cents(inv.total)}</td></tr>
      ${inv.applied ? `<tr><td>Paid / credited</td><td class="n">−${cents(inv.applied)}</td></tr>` : ''}
      <tr class="due"><td>Balance due</td><td class="n">${cents(inv.open)}</td></tr>
    </table>
    ${inv.payment_instructions ? `<div class="pay"><b>How to pay</b><br>${nl(inv.payment_instructions)}</div>` : ''}
    ${s && s.footer_note ? `<div class="foot">${nl(s.footer_note)}</div>` : ''}
  </body></html>`);
  w.document.close();
}

const auditTable = (rows) => {
  /* A row's "why" can live in two places: the mandatory reason ARGUMENT on acts that require
     one (set_credit_limit, cancel, void, write_off, holds…) — part of the business act itself —
     or the optional _reason narrative. The formal one wins; refusals show the refusal. */
  const why = (r) => {
    if (!r.ok) return r.error;
    try { const a = JSON.parse(r.args_json || '{}'); if (a.reason) return a.reason; if (a.note) return a.note; } catch {}
    return r.reason || '';
  };
  const t = $('<table><thead><tr><th>When</th><th>Who</th><th>Command</th><th>Subject</th><th>Reason / refusal</th></tr></thead><tbody></tbody></table>');
  for (const r of rows) t.querySelector('tbody').append($(
    `<tr><td>${r.at.slice(0,19).replace('T',' ')}</td><td><span class="who ${r.actor_kind}">${r.actor}</span></td>
     <td>${r.ok ? '' : '<span style="color:var(--warn)">✗ </span>'}${r.command}</td><td>${r.subject_id||''}</td>
     <td style="color:${r.ok?'var(--dim)':'var(--warn)'}">${why(r)}</td></tr>`));
  return t;
};

    const back = $('<button style="margin-bottom:16px">← back</button>'); back.onclick = () => { selected = null; render(); };
    main.append(back, await detail(selected.type, selected.id)); return;

      const t = $('<table><thead><tr><th>Account</th><th>Name</th><th>Tier</th><th>Vertical</th><th class="num">P</th><th>Customer</th></tr></thead><tbody></tbody></table>');
      rowsInto(t, groups[st], r => `<td>${r.id}</td><td>${r.name}</td><td>${r.tier ?? ''}</td><td>${r.vertical ?? ''}</td><td class="num">${Math.round(r.probability*100)}%</td><td>${r.customer_id ?? ''}</td>`, 'account');
    }
    if (!rows.length) main.append($('<div class="card doc">The list is empty — add the first account it can be said why.</div>'));
  }

        <b>${sc.name}</b>
        <span style="color:var(--dim);font-size:12px">${sc.file}</span>
        <span style="flex:1"></span>
      </summary><div class="body">
        ${sc.notes ? `<div class="doc" style="margin-bottom:6px">${sc.notes}</div>` : ''}
        <div class="steps"></div>
      </div></details>`);
      const walkBtn = $('<button class="primary" style="font-size:12px;padding:4px 10px">Walk through</button>');
      walkBtn.onclick = (ev) => { ev.preventDefault(); startWalk(sc.file); };
      const btn = $('<button style="font-size:12px;padding:4px 10px">Replay</button>');
      btn.onclick = async (ev) => {
        ev.preventDefault(); btn.disabled = true; btn.textContent = 'running…';
        const fresh = await fetch('/api/spec/replay?area=' + (window.specArea || 'o2c') + '&file=' + encodeURIComponent(sc.file), { method:'POST' }).then(r => r.json());
        renderSteps(det.querySelector('.steps'), fresh);
        det.open = true;
        det.querySelector('.badge').className = 'badge ' + (fresh.pass?'pass':'fail');
        det.querySelector('.badge').textContent = fresh.pass?'pass':'fail';
        btn.disabled = false; btn.textContent = 'Replay';
      };
      det.querySelector('summary').append(walkBtn, btn);
      renderSteps(det.querySelector('.steps'), sc);
      main.append(det);
    }

    main.append($('<div class="sub" style="margin-top:18px">Acts — spec surface vs implementation</div>'));
    const at = $('<table><thead><tr><th>Act</th><th>Kind</th><th>Command</th><th>Implemented</th><th>Exercised by a scenario</th></tr></thead><tbody></tbody></table>');
    for (const a of report.acts) at.querySelector('tbody').append($(
      `<tr><td>${a.act}</td><td>${a.kind}</td><td style="font-family:var(--mono);font-size:12px">${a.command||'—'}</td>
       <td>${a.implemented?'✓':'<span style="color:var(--warn)">missing</span>'}</td><td>${a.exercised?'✓':'<span style="color:var(--dim)">not yet</span>'}</td></tr>`));
    main.append(at);

    main.append($('<div class="sub" style="margin-top:18px">Invariants — and what exercises each</div>'));
    const it = $('<table><thead><tr><th>Id</th><th>Invariant</th><th>Evidence</th></tr></thead><tbody></tbody></table>');
    for (const inv of report.invariants) it.querySelector('tbody').append($(
      `<tr class="invrow"><td>${inv.id}</td><td>${inv.title}</td>
       <td style="font-size:12.5px;color:${inv.evidence.length?'var(--dim)':'var(--warn)'}">${inv.evidence.length ? inv.evidence.join('<br>') : 'no evidence yet'}</td></tr>`));
    main.append(it);
  }
  if (view === 'doctrine') {
    head('Doctrine', 'The rules the agent reads at connect. The same text a person reads here.');
    main.append($(`<div class="card doc">${REG.doctrine}</div>`));
    for (const m of REG.modules.filter(m => m.doctrine)) main.append($(`<div class="card"><b>module: ${m.name}</b><div class="help">${m.doctrine}</div></div>`));
    for (const c of REG.commands.filter(c => c.help)) main.append($(`<div class="card"><b>${c.title}</b> <span class="doc">— ${c.name}</span><div class="help">${c.help}</div></div>`));
  }
}

          et.querySelector('tbody').append(tr);
        }
        box.append(et);

      if (!ms.length && !ems.length) { box.append($('<div class="sub">No members yet — it\'s just you.</div>')); return; }
      if (!ms.length) return;
      const t = $('<table><thead><tr><th>Name</th><th>Role</th><th>Key</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>');
      for (const m of ms) {

          tr.lastElementChild.append(b);
        }
        t.querySelector('tbody').append(tr);
      }
      box.append(t);
    };
    drawMembers();
  };
  await draw();
  dlg.showModal();
}

/* ---------- the walkthrough: the same generated forms, filled in, one step at a time ----------
   For each step: show the command's form exactly as a person would have filled it, say what
   should happen, then run it for real in a scratch workspace and show what did happen —
   refusals included, because the refusals teach the rules. */
const money$ = (c) => '$' + (c/100).toFixed(2);
function fieldPreview(fld, value) {
  const wrap = $(`<label><b>${fld.label}</b></label>`);
  if (value === undefined || value === null) {
    wrap.append($('<input disabled placeholder="—">')); wrap.style.opacity = .55; return wrap;
  }
  if (fld.widget === 'lines' && Array.isArray(value)) {
    const t = $('<table class="lines"><thead><tr>' + fld.of.map(c => `<th>${c.label}</th>`).join('') + '</tr></thead><tbody></tbody></table>');
    for (const row of value) t.querySelector('tbody').append($('<tr>' + fld.of.map(c => {
      const v = row[c.key];
      return `<td><input disabled value="${v === undefined ? '' : (c.widget === 'money' ? money$(v) : v)}"></td>`;
    }).join('') + '</tr>'));
    wrap.append(t); return wrap;
  }
  const shown = fld.widget === 'money' ? money$(value) : fld.widget === 'checkbox' ? (value ? 'yes' : 'no') : String(value);
  wrap.append($(`<input disabled value="${String(shown).replace(/"/g,'&quot;')}">`));
  return wrap;
}

async function startWalk(file) {
  const plan = await fetch(wsUrl('/api/spec/plan?area=' + (window.specArea || 'o2c') + '&file=' + encodeURIComponent(file))).then(r => r.json());
  let i = 0, ran = false, passes = 0;
  const ov = $('<div id="walkOv"></div>');
  const close = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) close(); };

  const show = () => {
    const st = plan.steps[i];
    const cmd = REG.commands.find(c => c.name === st.command);
    ov.innerHTML = '';
    const card = $(`<div class="walk">
      <header>
        <b style="font-size:14px">${plan.name}</b>
        <div class="prog"><i style="width:${Math.round(100 * i / plan.steps.length)}%"></i></div>
        <button data-x style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--dim)">×</button>
      </header>
      <div class="body">
        <div class="phase">${st.phase === 'env' ? 'setting the stage' : 'step'} · ${st.expect.refused ? 'this one gets refused — that is the lesson' : 'this one goes through'}</div>
        <h3 class="act">${cmd ? cmd.title : st.act}</h3>
        <div class="cmdname">${st.act} → ${st.command}</div>
        ${st.notes ? `<div class="note">${st.notes}</div>` : ''}
        <div class="formprev"></div>
        <div class="expect">${st.expect.refused
          ? `Expected: <b>refused</b>, with a message containing “${st.expect.refused}”`
          : `Expected: <b>goes through</b>${st.expect.include ? ' — ' + Object.entries(st.expect.include).map(([k,v]) => `${k} = ${typeof v === 'number' && /total|amount|open|committed|balance|subtotal|tax|limit|price/.test(k) ? money$(v) : v}`).join(', ') : ''}`}</div>
        <div class="result"></div>
      </div>
      <footer>
        <span class="stepno">step ${i + 1} of ${plan.steps.length}</span>
        <button class="primary runbtn">${st.expect.refused ? 'Try it ▸' : 'Run this step ▸'}</button>
      </footer>
    </div>`);
    card.querySelector('[data-x]').onclick = close;
    const prev = card.querySelector('.formprev');
    if (cmd) for (const fld of cmd.fields) prev.append(fieldPreview(fld, st.args[fld.key]));
    else prev.append($(`<pre>${JSON.stringify(st.args, null, 1)}</pre>`));

    const runbtn = card.querySelector('.runbtn');
    runbtn.onclick = async () => {
      runbtn.disabled = true; runbtn.textContent = 'running…';
      const r = await fetch(wsUrl(`/api/spec/walk?area=${window.specArea || 'o2c'}&file=${encodeURIComponent(file)}&step=${i}`), { method: 'POST' }).then(x => x.json());
      ran = true; if (r.pass) passes++;
      const res = card.querySelector('.result');
      res.innerHTML = '';
      res.append($(`<div class="outcome ${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'} ${
        r.expect.refused ? (r.pass ? 'Refused, exactly as the rule says:' : 'Did not go as expected:') : (r.pass ? 'Done.' : 'Did not go as expected:')
      }
${r.actual}</div>`));
      runbtn.disabled = false;
      if (r.done) {
        runbtn.textContent = 'Finish';
        runbtn.onclick = () => {
          ov.querySelector('.body').innerHTML = `<h3 class="act" style="margin-top:6px">That was the whole flow.</h3>
            <p style="font-size:14px;color:var(--dim)">${passes} of ${plan.steps.length} steps behaved exactly as the spec says — refusals included.
            Every one of them just ran for real, through the same registry the buttons and the agent use.
            The scratch workspace it happened in is already gone; your data was never touched.</p>`;
          ov.querySelector('footer').innerHTML = '';
          const done = $('<button class="primary">Close</button>'); done.onclick = close;
          ov.querySelector('.walk footer, footer') || ov.querySelector('.walk').append($('<footer></footer>'));
          ov.querySelector('.walk footer').append(done);
        };
      } else {
        runbtn.textContent = 'Next step ▸';
        runbtn.onclick = () => { i = r.index + 1; show(); };
      }
      card.querySelector('.prog i').style.width = Math.round(100 * (i + 1) / plan.steps.length) + '%';
    };
    ov.append(card);
  };
  show();
  document.body.append(ov);
}

      ${REG.member.role === 'owner' && REG.space ? `<div style="margin-top:6px;display:flex;gap:5px">
        <a href="${wsUrl('/api/export')}" style="flex:1;text-align:center;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;color:var(--mid);text-decoration:none;font-family:var(--display);font-weight:700;white-space:nowrap">Export</a>

document.querySelectorAll('nav a').forEach(a => a.onclick = () => { view = a.dataset.v; selected = null; render(); });
document.querySelectorAll('nav .grp').forEach(g => {
  const items = document.querySelector(`[data-gi="${g.dataset.g}"]`);
  const apply = (closed) => { items.classList.toggle('closed', closed); g.querySelector('.tog').textContent = closed ? '+' : '−'; };
  apply(localStorage.getItem('nav.' + g.dataset.g) === 'closed');
  g.onclick = () => {
    const closed = !items.classList.contains('closed');
    localStorage.setItem('nav.' + g.dataset.g, closed ? 'closed' : 'open');
    apply(closed);
  };
});
if (['spec','doctrine','audit'].includes(location.hash.slice(1))) view = location.hash.slice(1);
boot().then(render);
</script>
