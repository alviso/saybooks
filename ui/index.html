<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,0&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root { --bg:#FAF7F1; --panel:#fff; --line:#E8E1D4; --ink:#1B2230; --dim:#6E7684; --muted:#6E7684; --mid:#454D5C; --accent:#1E7A4C; --accent2:#16633D; --tint:#E4F2E9; --tint2:#F4EFE6; --alert:#FDE9E4; --warn:#C8402A; --agent:#5A4FCF; --forest:#15291F; --leaf:#6BBF8C; --sun:#FFD467; --sun-soft:#FFF4D1; --sky:#E6EFFA; --sky-ink:#2657A6; --shadow:0 1px 0 rgba(40,30,10,.03),0 8px 22px -14px rgba(60,40,10,.22); --display:'Figtree',-apple-system,'Segoe UI',sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 var(--display); color:var(--ink); background:var(--bg); display:flex; flex-direction:column; height:100vh }
  .top { height:52px; flex:none; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:0 18px }
  .top .mark { display:inline-flex; align-items:center; gap:6px; font:700 13px var(--display); letter-spacing:.14em; color:var(--ink); text-decoration:none }
  .top .mark .wv { width:14px; height:17px; flex:none }
  .sw { position:relative } .sw > button { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); font:600 14px var(--display); color:var(--ink); cursor:pointer; max-width:340px }
  .sw > button small { font-weight:500; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .sw > button .chev { color:var(--dim); font-size:11px }
  .pop { position:absolute; top:calc(100% + 6px); left:0; min-width:260px; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(20,40,70,.12); padding:6px; z-index:40; display:none }
  .pop.open { display:block } .pop a, .pop button.item { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:6px; color:var(--ink); text-decoration:none; font:500 13.5px var(--display); background:none; border:none; cursor:pointer }
  .pop a:hover, .pop button.item:hover { background:var(--tint) } .pop .on { background:var(--tint); color:var(--accent); font-weight:600 } .pop .sep { height:1px; background:var(--line); margin:6px 4px } .pop .hint { font-size:11.5px; color:var(--dim); padding:6px 10px; line-height:1.5 }
  .pop.right { left:auto; right:0 }
  .gsearch { flex:1; max-width:520px } .gsearch input { width:100%; padding:7px 12px; border:1px solid var(--line); border-radius:6px; font:13px var(--display); background:var(--bg); color:var(--ink) }
  .top .who { margin-left:auto; position:relative } .top .who > button { display:flex; align-items:center; gap:10px; background:none; border:none; cursor:pointer; font:500 13px var(--display); color:var(--mid); padding:4px }
  .top .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font:700 12px var(--display); overflow:hidden } .top .avatar img { width:100%; height:100%; object-fit:cover }
  .shell { display:flex; flex:1; min-height:0 }
  nav.rail { width:216px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow:auto }
  nav.rail a { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; color:var(--mid); text-decoration:none; font:500 14px var(--display); cursor:pointer }
  nav.rail a svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none }
  nav.rail a:hover { background:var(--tint2); color:var(--ink) } nav.rail a.on { background:var(--tint); color:var(--accent); font-weight:600; box-shadow:inset 3px 0 0 var(--accent) }
  nav.rail .sep { height:1px; background:var(--line); margin:10px 6px } nav.rail .foot { margin-top:auto; font-size:11.5px; color:var(--dim); padding:10px 10px 4px; line-height:1.5 }
  .pick { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; background:var(--panel); font-size:13.5px; line-height:1.45 } .pick input { margin:3px 0 0; flex:none; width:16px; height:16px } .pick.on { border-color:var(--accent); background:var(--tint) }
  .crumbs { font:600 11.5px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:2px }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:0 0 18px; flex-wrap:wrap; align-items:flex-end }
  .tabs a { padding:8px 13px; color:var(--mid); text-decoration:none; font:500 13.5px var(--display); border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer } .tabs a:hover { color:var(--ink) }
  .tabs a.on { color:var(--accent); border-color:var(--accent); font-weight:600 }
  .tabs .tabacts { margin:0 0 6px auto !important; display:flex; gap:8px; flex-wrap:wrap }
  .connect { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--agent); border-radius:8px; padding:12px 16px; display:flex; gap:16px; align-items:center; margin:0 0 18px; font-size:13.5px } .connect .t { display:block; font-weight:700 } .connect code { font-family:var(--mono); font-size:12px; background:var(--tint); padding:2px 6px; border-radius:4px; user-select:all } .connect .x { margin-left:auto; background:none; border:none; color:var(--dim); cursor:pointer; font-size:16px }
  @media (max-width:900px) { nav.rail { width:56px; padding:10px 6px } nav.rail a span, nav.rail .foot { display:none } nav.rail a { justify-content:center; padding:10px 0 } .gsearch { display:none } .sw > button small { display:none } }
  main { flex:1; overflow:auto; padding:28px 34px }
  h2 { margin:0 0 4px; font:700 24px var(--display); letter-spacing:-.02em } .sub { color:var(--dim); margin-bottom:18px; font-size:13.5px }
  table { border-collapse:collapse; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow) }
  th { text-align:left; font:700 11.5px var(--display); color:var(--dim); padding:11px 14px; border-bottom:1px solid var(--line) }
  td { padding:10px 14px; border-bottom:1px solid hsl(215 25% 93%) } tr:last-child td { border-bottom:none }
  tbody tr { cursor:pointer } tbody tr:hover { background:var(--bg) }
  .num { text-align:right; font-variant-numeric:tabular-nums }
  /* A toggle that is on: the filter bars and the attendance row. Without this a pressed
     button looked exactly like an unpressed one, which is the same as having no button. */
  .acts button.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  .pill { font:700 11px var(--display); padding:3px 9px; border-radius:4px; background:var(--tint2); color:var(--mid) }
  .pill.attending,.pill.registered { background:#E3ECF7; color:#2C5282 } .pill.went { background:#E8F0E2; color:#3E6B2B } .pill.skip { background:var(--tint2); color:var(--mid); text-decoration:line-through }
  .pill.confirmed,.pill.sent,.pill.issued,.pill.submitted { background:#E3ECF7; color:#2C5282 } .pill.shipped { background:#E8F0E2; color:#3E6B2B }
  .pill.closed,.pill.paid,.pill.accepted,.pill.active,.pill.purchase,.pill.matched { background:var(--tint); color:var(--accent) } .pill.lapsed,.pill.missed,.pill.unreviewed { background:#FFF3CD; color:#7a5a00 } .pill.recurring { background:#E3ECF7; color:#2C5282 }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; box-shadow:var(--shadow) } .chart h3 { margin:0 0 8px; font-size:13px; color:var(--mid); font-weight:600 }
  .chart svg text { font: 11px var(--display); fill: var(--dim) } .chart .bar { fill:hsl(215 60% 22%); opacity:.85 } .chart .bar:hover { opacity:1 } .chart .grid { stroke:var(--line); stroke-width:1 }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; box-shadow:var(--shadow) } .tile .k { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:600 } .tile .v { font-size:22px; font-weight:700; margin-top:2px } .tile .s { font-size:12px; color:var(--dim) }
  #tip { position:fixed; pointer-events:none; background:var(--ink); color:#fff; font-size:12px; padding:5px 8px; border-radius:6px; display:none; z-index:50 } .pill.cancelled,.pill.void,.pill.rejected,.pill.ghosted { background:var(--alert); color:var(--warn) }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow) }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 22px }
  .kv div span { display:block; font:600 12px var(--display); color:var(--dim); margin-bottom:2px }
  button { font:700 13px var(--display); padding:8px 14px; border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer; color:var(--ink) }
  button:hover:not(:disabled) { background:var(--tint); border-color:var(--tint); color:var(--accent) }
  button:disabled { opacity:.42; cursor:not-allowed }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); border-radius:6px; box-shadow:none }
  button.primary:hover:not(:disabled) { background:var(--accent2); border-color:var(--accent2); color:#fff }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px }

  .help { white-space:pre-wrap; font-size:12.5px; color:var(--mid); margin-top:8px; background:var(--bg); border-radius:6px; padding:8px 12px }
  form { padding:18px 20px; max-height:58vh; overflow:auto } dialog footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end }

  input,select,textarea { font:inherit; width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:6px; background:var(--panel) }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--tint); border-color:var(--accent) }
  .req b:after { content:" *"; color:var(--warn) }

  .who { font-size:11px; padding:1px 7px; border-radius:4px; font-weight:600; font-family:var(--mono) }
  .who.human { background:#E3ECF7; color:#2C5282 } .who.agent { background:hsl(248 60% 96%); color:var(--agent) }
  .doc { font-size:12.5px; color:var(--dim); white-space:pre-wrap; line-height:1.6 }
  .badge { font-size:11px; font-weight:600; padding:2px 9px; border-radius:8px }
  .badge.pass { background:var(--tint); color:var(--accent) } .badge.fail { background:var(--alert); color:var(--warn) }
  .step { border-left:3px solid var(--line); padding:8px 12px; margin:8px 0; font-size:13px }
  .step.pass { border-left-color:var(--accent) } .step.fail { border-left-color:var(--warn) }
  .step .hd { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap }

  details.scen { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; box-shadow:var(--shadow) }
  details.scen summary { padding:12px 16px; cursor:pointer; display:flex; gap:10px; align-items:center; list-style:none }
  details.scen summary::-webkit-details-marker { display:none }

  .invrow td:first-child { font-family:var(--mono); font-size:12px; color:var(--accent) }

  .walk { background:var(--bg); border:1px solid var(--line); border-radius:8px; width:min(680px,94vw); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 24px 70px #0004 }
  .walk header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px }

  .walk .body { padding:18px 22px; overflow:auto }
  .walk .phase { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }

  .walk .note { background:var(--tint); border-radius:6px; padding:10px 14px; margin:12px 0; font-size:14px }

  .walk .formprev label { margin-bottom:10px } .walk .formprev input { background:var(--bg); color:var(--ink) }

  .walk .outcome.pass { background:var(--tint); color:hsl(215 60% 17%) } .walk .outcome.fail { background:var(--alert); color:var(--warn) }
  :root[data-x] .noop {}
  .walk footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; align-items:center }
  .walk .stepno { color:var(--dim); font-size:12.5px; margin-right:auto }

  /* ---- 2026-09-29 visual pass: the site's look carried into the workbench. A dark green
     frame (top bar and rail) around warm paper, green for what is active, the serif for page
     titles and big numbers, a colour per status. Only presentation; no markup depends on it. */
  body { font-size:14.5px; -webkit-font-smoothing:antialiased }
  .top { height:58px; background:var(--forest); border-bottom:none; gap:18px; padding:0 20px }
  .top .mark { color:#fff; font-weight:800; font-size:13.5px } .top .mark .wv { stroke:var(--leaf) }
  .sw > button { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:#fff; border-radius:9px }
  .sw > button:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.22); color:#fff }
  .sw > button small, .sw > button .chev { color:#A9C4B3 }
  .gsearch input { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:9px; padding:8px 14px }
  .gsearch input::placeholder { color:#A9C4B3 } .gsearch input:focus { outline:none; background:rgba(255,255,255,.14); border-color:var(--leaf) }
  .top .who > button { color:#CFE3D6 } .top .who > button:hover { color:#fff; background:none }

  nav.rail { background:var(--forest); border-right:none; padding:12px 12px 14px; gap:3px }

  nav.rail a.on svg { stroke:var(--leaf) }
  nav.rail .sep { background:rgba(255,255,255,.1) } nav.rail .foot { color:#8FAA99 } nav.rail .foot b { color:#CFE3D6 }
  main { padding:30px 38px 60px }
  main h2 { font:600 29px/1.15 var(--serif); letter-spacing:-.02em; font-variation-settings:"SOFT" 100 }

  .tabs a:hover { color:var(--ink) } .tabs a.on { color:var(--accent); border-color:var(--accent) }

  th { background:#F7F3EB; font:700 11px var(--display); letter-spacing:.06em; text-transform:uppercase; color:#7A8190; padding:11px 14px }
  td { padding:11px 14px; border-bottom-color:#F1ECE2 }

  button:hover:not(:disabled) { background:var(--tint2); border-color:#DDD4C4; color:var(--ink) }
  button.primary { background:var(--accent); border-color:var(--accent); border-radius:9px; box-shadow:0 4px 12px -6px rgba(30,122,76,.7) }

function openForm(spec, prefill = {}) {
  const dlg = document.getElementById('dlg');

  const form = document.createElement('form');
  const state = { ...prefill };
  const hadValue = { ...prefill };   // a prefilled field cleared by the user means CLEAR, not "no change"

  for (const f of spec.fields) {
    const wrap = $(`<label class="${f.required?'req':''}"><b>${f.label}</b><i>${f.hint||''}</i></label>`);
    let el;
    if (f.widget === 'lines') {
      el = linesEditor(f, state);
    } else if (f.widget === 'lookup' || f.widget === 'select') {
      el = document.createElement('select');
      el.append(new Option(f.required ? '— choose —' : '— none —', ''));
      for (const o of (f.widget === 'lookup' ? (REG.lookups[f.entity]||[]) : f.options.map(v=>({id:v,label:v}))))
        el.append(new Option(o.label + (o.label !== o.id ? `  (${o.id})` : ''), o.id));
      el.value = state[f.key] ?? '';
      el.onchange = () => state[f.key] = el.value || undefined;
    } else if (f.widget === 'file') {
      /* a file field sends the file as a data URL — the same argument an agent passes over MCP */
      el = Object.assign(document.createElement('input'), { type:'file', accept:'image/png,image/jpeg,image/svg+xml,image/webp' });
      el.onchange = () => {
        const file = el.files[0];
        if (!file) { state[f.key] = undefined; return; }
        const r = new FileReader(); r.onload = () => { state[f.key] = r.result; }; r.readAsDataURL(file);
      };
    } else if (f.widget === 'checkbox') {
      el = Object.assign(document.createElement('input'), { type:'checkbox', checked: state[f.key] !== false });
      el.style.width = 'auto'; el.onchange = () => state[f.key] = el.checked;

      };
      tr.lastElementChild.append(btn);
      tr.onclick = () => { selected = { type: 'crm_contact', id: c.id }; render(); };
      btn.addEventListener('click', (e) => e.stopPropagation());
      tr.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => e.stopPropagation()));
      ct.querySelector('tbody').append(tr);
    }
    wrap.append($('<div class="sub" style="margin-top:16px">Contacts — gaps are findings, not blanks</div>'), ct);
    {
      const evbar = $('<div class="acts" style="margin-top:16px"></div>');
      const addEv = $('<button type="button">Add event…</button>');
      addEv.onclick = () => openForm(cmd('crm_add_event'), { account_id: id });

      const evs = entity.events || [];
      wrap.append($(`<div class="sub" style="margin-top:16px">Events — ${evs.length ? `${evs.filter(e => e.status === 'planned').length} planned` : 'nothing on the calendar for this account'}</div>`));

    if (entity.activity.length) {
      const at2 = $('<table><thead><tr><th>Occurred</th><th>Medium</th><th>Summary</th></tr></thead><tbody></tbody></table>');
      for (const x of entity.activity) at2.querySelector('tbody').append($(`<tr><td>${x.occurred_at}</td><td>${x.medium || ''}</td><td>${x.summary}</td></tr>`));
      wrap.append($('<div class="sub" style="margin-top:16px">Activity — dated when it happened, not when it was typed</div>'), at2);
    }
  }
  if (type === 'invoice') {
    const bar = $('<div class="acts" style="margin:2px 0 14px"></div>');
    const b = $('<button class="primary">Document — print / save PDF</button>');
    b.onclick = () => invoiceDoc(entity);
    bar.append(b); wrap.append(bar);
    if (!entity.seller) wrap.append($('<div class="card doc" style="color:var(--warn)">No company profile yet — the document prints without a seller block. Set it under Customers → Company profile.</div>'));
  }
  if (type === 'solo_invoice') {
    const bar2 = $('<div class="acts" style="margin:2px 0 14px"></div>');
    if (entity.doc_path && entity.status === 'draft') {
      const b = $('<button class="primary">Preview document</button>');
      b.onclick = () => window.open(entity.doc_path, '_blank');
      bar2.append(b, $('<span class="sub" style="margin:0;align-self:center">Marked DRAFT until issued — issuing freezes the numbers and this link becomes the invoice.</span>'));
    } else if (entity.doc_path) {
      const b = $('<button class="primary">Document — print / save PDF</button>');
      b.onclick = () => window.open(entity.doc_path, '_blank');
      const cp = $('<button>Copy client link</button>');
      cp.onclick = () => navigator.clipboard.writeText(location.origin + entity.doc_path).then(() => toast('✓ link copied — send it to your client'));
      bar2.append(b, cp);
      if (entity.pdf_path) { const pb = $('<button>Download PDF</button>'); pb.onclick = () => window.open(entity.pdf_path, '_blank'); bar2.append(pb); }
    }
    wrap.append(bar2);
    if (entity.reminders && entity.reminders.length) {
      const rt = $('<table style="margin-bottom:14px"><thead><tr><th>Reminder</th><th>Stage</th><th>Status</th><th>Subject</th></tr></thead><tbody></tbody></table>');
      for (const r of entity.reminders) rt.querySelector('tbody').append($(`<tr style="cursor:default"><td>${r.id}</td><td>${['', 'first', 'second'][r.stage] || 'final'}</td><td><span class="pill ${r.status === 'sent' ? 'sent' : r.status === 'draft' ? 'unreviewed' : 'draft'}">${r.status}${r.sent_at ? ' ' + r.sent_at : ''}</span></td><td>${esc(r.subject)}</td></tr>`));
      wrap.append($('<div class="sub" style="margin:0 0 6px">Payment reminders</div>'), rt);
    }
    const showRef = entity.lines.some(l => l.ref), showTax = entity.tax_registered || entity.tax_total > 0;
    const lt = $(`<table><thead><tr>${showRef ? '<th>Ref</th>' : ''}<th>Description</th><th class="num">Qty</th><th class="num">Rate</th>${showTax ? `<th class="num">${entity.tax_label || 'Tax'}</th>` : ''}<th class="num">Amount</th></tr></thead><tbody></tbody></table>`);
    for (const l of entity.lines) lt.querySelector('tbody').append($(
      `<tr>${showRef ? `<td style="color:var(--dim)">${l.ref || ''}</td>` : ''}<td>${l.description}</td><td class="num">${l.qty}</td><td class="num">${l.rate_display || cents(l.rate)}</td>${showTax ? `<td class="num">${l.tax_display || '—'}</td>` : ''}<td class="num">${l.amount_display || cents(l.amount)}</td></tr>`));
    if (entity.subject) wrap.prepend($(`<div class="sub" style="margin:0 0 8px">${entity.subject}</div>`));
    wrap.append(lt);
    if (entity.notes) wrap.append($(`<div class="card doc" style="margin-top:10px">${entity.notes}</div>`));
  }
  if (type === 'purch_transaction' && entity.split && entity.split.length) {
    const t = $('<table><thead><tr><th>Part</th><th>Category</th><th class="num">Amount</th><th>Note</th></tr></thead><tbody></tbody></table>');
    entity.split.forEach((l, i) => t.querySelector('tbody').append($(`<tr><td>${i + 1}</td><td>${l.category}</td><td class="num">${l.amount_display}</td><td style="color:var(--dim)">${l.note || ''}</td></tr>`)));
    wrap.append($('<div class="sub" style="margin-top:14px">Split into ' + entity.split.length + ' parts — the row itself is unchanged</div>'), t);
  }
  if (type === 'purch_rule' && entity.rows && entity.rows.length) {
    const t = $('<table><thead><tr><th>Row</th><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    wrap.append($('<div class="sub" style="margin-top:14px">Waiting for your confirmation: suggested as ' + esc(entity.category) + '</div>'), fillRows(t, entity.rows, r => `<td>${r.id}</td><td>${r.date}</td><td>${esc(r.description)}</td><td class="num">${r.amount_display}</td>`, 'purch_transaction'));
  }
  if (type === 'purch_subscription' && entity.periods) {
    const t = $('<table><thead><tr><th>Expected</th><th>Result</th><th>Charged on</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    for (const p of [...entity.periods].reverse()) t.querySelector('tbody').append($(`<tr><td>${p.expected}</td><td><span class="pill ${p.matched ? 'matched' : p.missed ? 'missed' : ''}">${p.matched ? 'charged' : p.missed ? 'missed' : p.no_statement_yet ? 'no statement yet' : 'pending'}</span></td><td>${p.date || '—'}</td><td class="num">${p.amount_display || ''}</td></tr>`));
    wrap.append($('<div class="sub" style="margin-top:14px">Periods, as of ' + entity.as_of + '</div>'), t);
  }
  if (type === 'purch_receipt' && entity.candidates && entity.candidates.length) {
    const t = $('<table><thead><tr><th>Row</th><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    wrap.append(fillRows(t, entity.candidates, r => `<td>${r.id}</td><td>${r.date}</td><td>${r.description}</td><td class="num">${r.amount_display}</td>`, 'purch_transaction'));
    wrap.append($('<div class="sub" style="margin-top:14px">Candidate rows — match one with a reason</div>'), t);
  }
  if (type === 'purch_source' && entity.rows) {
    const t = $('<table><thead><tr><th>#</th><th>Row</th><th>Date</th><th>Description</th><th>Vendor</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    wrap.append(fillRows(t, entity.rows, r => `<td>${r.row_index}</td><td>${r.id}</td><td>${r.date}</td><td>${r.description}</td><td>${r.vendor || ''}</td><td><span class="pill ${r.status}">${r.status}</span></td><td class="num">${r.amount_display}</td>`, 'purch_transaction'));
    wrap.append($('<div class="sub" style="margin-top:14px">Rows, in the statement\'s order</div>'), t);
  }
  if (entity.lines && type !== 'solo_invoice' && type !== 'p2p_po') {
    const t = $('<table><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Shipped</th><th class="num">Invoiced</th><th class="num">Price</th><th class="num">Amount</th></tr></thead><tbody></tbody></table>');
    for (const l of entity.lines) t.querySelector('tbody').append($(
      `<tr><td>${l.id}</td><td>${l.item_name}</td><td class="num">${l.qty}</td><td class="num">${l.qty_shipped ?? '—'}</td><td class="num">${l.qty_invoiced ?? '—'}</td><td class="num">${cents(l.unit_price)}</td><td class="num">${cents(l.qty*l.unit_price)}</td></tr>`));
    wrap.append(t);
  }
  const trail = await fetch(wsUrl(`/api/cmd/core_audit`), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ subject_id:id, limit:20 }) }).then(r=>r.json());
  wrap.append($('<div class="sub" style="margin-top:20px">History</div>'), auditTable(trail.result));
  return wrap;
}

/* Bank CSV import: parsing and matching happen here for preview, but every recorded row goes
   through o2c_record_payment individually — same choke point, same log, refusals surfaced. */
function bankImportDialog() {
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = '';
  const box = $(`<div style="min-width:720px;max-width:900px"><h2>Import bank CSV</h2>
    <div class="doc" style="margin-bottom:10px">Paste rows from your bank export. Each row becomes its own <b>Record payment</b> — individually logged, refusals shown. Outflows and unmatched payers are skipped, never guessed (matching a payment to an invoice stays a separate act).</div>
    <textarea rows="7" style="width:100%;font:12px var(--mono)" placeholder="Date,Amount,Payer,Reference&#10;2026-08-20,1250.00,Northwind Traders,WIRE-4471"></textarea>
    <div class="acts" style="margin-top:10px"><button class="primary">Preview</button><button value="cancel">Close</button></div>
    <div class="stage"></div></div>`);
  const ta = box.querySelector('textarea'), stage = box.querySelector('.stage');
  const [prevBtn, closeBtn] = box.querySelectorAll('.acts button');
  closeBtn.onclick = () => dlg.close();

  const parse = (text) => {
    const first = text.split(/\r?\n/).find(l => l.trim());
    const delim = [',', ';', '\t'].map(d => [d, (first.match(new RegExp('\\' + d, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (cur.trim() !== '' || row.length) { row.push(cur.trim()); rows.push(row); } row = []; cur = ''; }
      else cur += ch;
    }
    if (cur.trim() !== '' || row.length) { row.push(cur.trim()); rows.push(row); }
    return rows.filter(r => r.some(c => c !== ''));
  };
  const centsOf = (s) => {
    let v = String(s || '').replace(/[$\s]/g, '');
    if (/,\d{2}$/.test(v) && !v.includes('.')) v = v.replace(',', '.');
    v = v.replace(/,/g, '');
    const f = parseFloat(v);
    return Number.isFinite(f) ? Math.round(f * 100) : null;
  };
  const isoOf = (s) => {
    const v = String(s || '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    const m = v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    return m ? `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : null;
  };

  prevBtn.onclick = () => {
    const all = parse(ta.value);
    if (!all.length) { stage.innerHTML = '<div class="doc" style="color:var(--warn)">Nothing to parse.</div>'; return; }
    const looksHeader = all[0].every(c => centsOf(c) === null || /[a-z]{3,}/i.test(c)) && all.length > 1;
    const header = looksHeader ? all[0] : all[0].map((_, i) => 'column ' + (i + 1));
    const data = looksHeader ? all.slice(1) : all;
    const guess = (re) => { const i = header.findIndex(h => re.test(h)); return i >= 0 ? i : null; };
    const map = {
      date: guess(/date|posted|booking/i) ?? 0,
      amount: guess(/amount|value|credit|sum/i) ?? 1,
      payer: guess(/payer|name|description|counterparty|from|detail/i) ?? 2,
      reference: guess(/ref|memo|note|id/i) ?? 3,
    };
    stage.innerHTML = '';
    const mapRow = $('<div class="acts" style="margin:10px 0;align-items:center;flex-wrap:wrap"></div>');
    const sel = {};
    for (const k of ['date', 'amount', 'payer', 'reference']) {
      const s2 = $(`<select>${header.map((h, i) => `<option value="${i}" ${i === map[k] ? 'selected' : ''}>${h}</option>`).join('')}</select>`);
      sel[k] = s2; mapRow.append($(`<span class="sub" style="margin:0">${k}</span>`), s2);
    }
    const methodSel = $('<select><option>ach</option><option>wire</option><option>check</option><option>card</option></select>');
    mapRow.append($('<span class="sub" style="margin:0">method</span>'), methodSel);
    const rebuild = $('<button>Re-match</button>'); mapRow.append(rebuild);
    stage.append(mapRow);

    const custs = (REG.lookups && REG.lookups.customer) || [];
    const matchOf = (payer) => {
      const p = payer.toLowerCase();
      return custs.find(c => p.includes(c.name.toLowerCase()) || c.name.toLowerCase().includes(p)) || null;
    };
    const tblBox = $('<div style="max-height:320px;overflow-y:auto;margin-top:6px"></div>');
    stage.append(tblBox);
    const runRow = $('<div class="acts" style="margin-top:10px"></div>');
    const runBtn = $('<button class="primary">Record payments</button>'); runRow.append(runBtn);
    const out = $('<div class="doc" style="margin-top:8px"></div>'); stage.append(runRow, out);

    let items = [];
    const buildTable = () => {
      items = data.map(r => {
        const amount = centsOf(r[+sel.amount.value]);
        const date = isoOf(r[+sel.date.value]);
        const payer = r[+sel.payer.value] || '';
        return { amount, date, payer, reference: r[+sel.reference.value] || '', customer: matchOf(payer), skip: amount === null || amount <= 0 };
      });
      const t = $('<table><thead><tr><th>Date</th><th>Payer (as printed)</th><th>Customer</th><th>Ref</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody></tbody></table>');
      items.forEach((it) => {
        const cs = $(`<select><option value="">— skip —</option>${custs.map(c => `<option value="${c.id}" ${it.customer && it.customer.id === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>`);
        cs.onchange = () => { it.customer = custs.find(c => c.id === cs.value) || null; };
        const tr = $(`<tr><td>${it.date || '<span style="color:var(--warn)">?</span>'}</td><td style="font-size:12px">${it.payer}</td><td></td>
          <td style="font-size:12px">${it.reference}</td><td class="num">${it.amount != null ? cents(it.amount) : '?'}</td>
          <td class="st" style="font-size:12px;color:var(--dim)">${it.skip ? (it.amount != null && it.amount <= 0 ? 'outflow — skipped' : 'bad amount — skipped') : (it.customer ? 'ready' : 'no match — pick or skip')}</td></tr>`);
        tr.children[2].append(cs); it._tr = tr;
        t.querySelector('tbody').append(tr);
      });
      tblBox.innerHTML = ''; tblBox.append(t);
    };
    rebuild.onclick = buildTable;
    buildTable();

    runBtn.onclick = async () => {
      runBtn.disabled = true;
      let ok = 0, skipped = 0, refused = 0;
      for (const it of items) {
        const st = it._tr.querySelector('.st');
        if (it.skip || !it.customer) { skipped++; continue; }
        try {
          const r = await api('o2c_record_payment', { customer_id: it.customer.id, amount: it.amount,
            method: methodSel.value, reference: it.reference || undefined, received_at: it.date || undefined });
          ok++; st.textContent = `recorded ${r.id}`; st.style.color = 'var(--accent)';
        } catch (e) { refused++; st.textContent = e.message; st.style.color = 'var(--warn)'; }
      }
      out.textContent = `${ok} recorded as unapplied cash, ${skipped} skipped, ${refused} refused. Every recorded row is in the audit trail; apply them to invoices from this page.`;
      runBtn.textContent = 'Done — close to refresh'; closeBtn.onclick = () => { dlg.close(); render(); };
    };
  };
  dlg.append(box); dlg.showModal();
}

/** Fill a table's tbody with clickable rows. Returns the table; the caller decides where it
    goes, which is what lets a page and a detail panel share one row builder. */
function fillRows(t, rows, cells, type) {
  for (const r of rows) {
    const tr = $(`<tr>${cells(r)}</tr>`);
    tr.dataset.search = Object.values(r).filter(v => v != null && typeof v !== 'object').join(' ');
    if (type && type !== 'nolink') {
      tr.onclick = () => { selected = type === 'accountFromGap' ? { type: 'account', id: r.account_id } : { type, id: r.id }; render(); };
    } else {
      tr.style.cursor = 'default';
    }
    t.querySelector('tbody').append(tr);
  }
  return t;
}

/** Bring books in from an export file (the JSON "Export these books" writes). On saybooks.io it
    becomes a new space; locally (hostel's books) it fills the empty books you are in. */
function importCard(hosted) {
  const c = $(`<div class="card" style="max-width:820px;margin-top:14px">
    <div style="font-weight:600;margin-bottom:4px">${hosted ? 'Or bring your books in' : 'Bring your books in'}</div>
    <div style="color:var(--dim);font-size:13.5px;margin-bottom:12px">${hosted
      ? 'Have an export from Saybooks on your Mac, or from another account? Choose the file and it becomes a space of its own, history and audit trail included.'
      : 'Have an export from saybooks.io or another Mac? These books are empty, so they can take it whole, history and audit trail included.'}</div>
    <label class="primary" style="display:inline-block;cursor:pointer;padding:7px 14px;border-radius:6px;background:var(--accent,#1f3a5f);color:#fff;font-weight:600;font-size:13.5px">Choose export file…<input type="file" accept=".json,application/json" style="display:none"></label>
    <span class="imp-state" style="margin-left:10px;color:var(--dim);font-size:13px"></span></div>`);
  const state = c.querySelector('.imp-state');
  c.querySelector('input').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    state.textContent = `Reading ${file.name}…`;
    const nameEl = document.querySelector('#nsName'); const name = hosted && nameEl ? nameEl.value.trim() : '';
    const url = wsUrl('/api/space/import') + (name ? (wsUrl('/api/space/import').includes('?') ? '&' : '?') + 'name=' + encodeURIComponent(name) : '');
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: file }).then(x => x.json()).catch(() => ({ error: 'The upload did not reach the server.' }));
    if (r.error) { state.textContent = ''; toast('✗ ' + r.error); return; }
    state.textContent = `${r.rows} rows brought in${r.skipped && r.skipped.length ? `, ${r.skipped.length} parts this version cannot hold` : ''}.`;
    setTimeout(() => { location.href = '/app?ws=' + encodeURIComponent(r.ws); }, 900);
  };
  return c;
}

/** One event, as a card row: when, what, with whom, where it came from, and the buttons that
    close it. Shared by the calendar page and the account and contact panels. */
function eventRow(e, opts = {}) {
  const when = `${e.date}${e.time ? ` ${e.time}` : ''}`;
  const row = $(`<div class="card" style="margin-bottom:8px;padding:10px 14px">
    <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap">
      <b style="white-space:nowrap">${when}</b>
      <span class="pill ${e.status}">${e.status}</span>${e.attendance ? `<span class="pill ${e.attendance}">${{ skip: 'not attending', attending: 'attending', registered: 'registered', went: 'went' }[e.attendance]}</span>` : ''}
      <span class="pill">${e.kind}</span>
      <span style="font-weight:600">${esc(e.title)}</span>
      ${opts.showAccount && e.account_name ? `<a href="#" data-acc>${esc(e.account_name)}</a>` : ''}
      ${e.contact_name ? `<span style="color:var(--muted)">with <a href="#" data-con>${esc(e.contact_name)}</a></span>` : ''}
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:3px">
      ${e.location ? esc(e.location) + ' · ' : ''}${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" data-stop>event page</a> · ` : ''}source: ${/^https?:\/\//.test(e.source) ? `<a href="${esc(e.source)}" target="_blank" rel="noopener" data-stop>${esc(e.source.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60))}</a>` : esc(e.source)} · added by ${esc(e.created_by)}
    </div>
    ${e.note ? `<div class="doc" style="font-size:13px;margin-top:5px">${esc(e.note)}</div>` : ''}
    ${e.outcome ? `<div class="doc" style="font-size:13px;margin-top:5px"><b>Outcome:</b> ${esc(e.outcome)}</div>` : ''}
    ${e.status === 'cancelled' && e.status_reason ? `<div class="doc" style="font-size:13px;margin-top:5px"><b>Cancelled:</b> ${esc(e.status_reason)}</div>` : ''}
    <div class="acts evacts" style="margin-top:8px"></div>
  </div>`);
  const a1 = row.querySelector('[data-acc]'); if (a1) a1.onclick = (ev) => { ev.preventDefault(); selected = { type: 'account', id: e.account_id }; render(); };
  const a2 = row.querySelector('[data-con]'); if (a2) a2.onclick = (ev) => { ev.preventDefault(); selected = { type: 'crm_contact', id: e.contact_id }; render(); };
  row.querySelectorAll('[data-stop]').forEach(a => a.onclick = (ev) => ev.stopPropagation());
  const acts = row.querySelector('.evacts');
  if (e.status !== 'cancelled') {
    // Your stance, one click each, the current one lit. No form: there is nothing to type.
    const today = new Date().toISOString().slice(0, 10);
    const STANCE = [['skip', 'Not attending'], ['attending', 'Attending'], ['registered', 'Registered'], ['went', 'Went']];
    for (const [k, label] of STANCE) {
      const b = $(`<button type="button" class="${e.attendance === k ? 'on' : ''}">${label}</button>`);
      if (k === 'went' && e.date > today) { b.disabled = true; b.title = 'After the date.'; }
      b.onclick = async () => {
        try { await api('crm_attend_event', { event_id: e.id, attendance: k }); toast(`✓ ${label}`); render(); }
        catch (err) { toast(err.message); }
      };
      acts.append(b);
    }
    // The organiser's verbs, kept small: they fit an event you scheduled, and the odd found
    // one whose page changed under you.
    const more = $('<span style="margin-left:auto;display:inline-flex;gap:6px"></span>');
    if (e.status === 'planned') {
      const done = $('<button type="button" style="font-size:11px;padding:3px 9px">What came of it…</button>');
      done.onclick = () => openForm(cmd('crm_update_event'), { event_id: e.id, status: 'done' });
      const move = $('<button type="button" style="font-size:11px;padding:3px 9px">Reschedule…</button>');
      move.onclick = () => openForm(cmd('crm_update_event'), { event_id: e.id, date: e.date, time: e.time || undefined, location: e.location || undefined });
      const cancel = $('<button type="button" style="font-size:11px;padding:3px 9px">Cancelled…</button>');
      cancel.onclick = () => openForm(cmd('crm_update_event'), { event_id: e.id, status: 'cancelled' });
      more.append(done, move, cancel);
    }
    acts.append(more);
    acts.style.display = 'flex'; acts.style.alignItems = 'center'; acts.style.flexWrap = 'wrap';
  } else acts.remove();
  return row;
}

const auditTable = (rows) => {
  /* A row's "why" can live in two places: the mandatory reason ARGUMENT on acts that require
     one (set_credit_limit, cancel, void, write_off, holds…) — part of the business act itself —
     or the optional _reason narrative. The formal one wins; refusals show the refusal. */
  const why = (r) => {
    if (!r.ok) return r.error;
    try { const a = JSON.parse(r.args_json || '{}'); if (a.reason) return a.reason; if (a.note) return a.note; } catch {}
    return r.reason || '';
  };
  const t = $('<table class="audit"><thead><tr><th>When</th><th>Who</th><th>Command</th><th>Subject</th><th>Reason / refusal</th></tr></thead><tbody></tbody></table>');
  for (const r of rows) t.querySelector('tbody').append($(
    `<tr><td>${r.at.slice(0,19).replace('T',' ')}</td><td><span class="who ${r.actor_kind}">${r.actor}</span></td>
     <td>${r.ok ? '' : '<span style="color:var(--warn)">✗ </span>'}${r.command}</td><td>${r.subject_id||''}</td>
     <td style="color:${r.ok?'var(--dim)':'var(--warn)'}">${why(r)}</td></tr>`));
  return t;
};

/* One-hue bar charts, hover tooltips, direct labels on the ends only. Values are minor units; labels come pre-formatted from the server. */
function barChart(title, rows, opts = {}) {
  const box = $(`<div class="chart"><h3>${title}</h3></div>`);
  if (!rows.length) { box.append($('<div class="sub" style="margin:0">Nothing yet.</div>')); return box; }
  const max = Math.max(...rows.map(r => r.value), 1);
  let tip = document.getElementById('tip'); if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; document.body.append(tip); }
  const show = (e, r) => { tip.style.display = 'block'; tip.innerHTML = `<b>${r.label}</b> · ${r.display}${r.sub ? `<br><span style="opacity:.8">${r.sub}</span>` : ''}`; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
  const hide = () => { tip.style.display = 'none'; };
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const x = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) x.setAttribute(k, v); return x; };
  if (opts.vertical) {
    const W = 520, H = 200, L = 8, B = 28, T = 18, bw = Math.max(6, Math.min(36, (W - L * 2) / rows.length - 6));
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, preserveAspectRatio: 'none' });
    for (let g = 1; g <= 3; g++) { const y = T + (H - T - B) * (1 - g / 3); svg.append(el('line', { x1: L, x2: W - L, y1: y, y2: y, class: 'grid', 'stroke-dasharray': '2 3' })); }
    svg.append(el('line', { x1: L, x2: W - L, y1: H - B, y2: H - B, class: 'grid' }));
    const step = (W - L * 2) / rows.length;
    rows.forEach((r, i) => {
      const h = Math.max(2, (H - T - B) * r.value / max), x = L + i * step + (step - bw) / 2, y = H - B - h;
      const rect = el('rect', { x, y, width: bw, height: h, rx: 3, class: 'bar' }); rect.onmousemove = (e) => show(e, r); rect.onmouseleave = hide; svg.append(rect);
      if (rows.length <= 14 || i % Math.ceil(rows.length / 12) === 0) { const t = el('text', { x: x + bw / 2, y: H - B + 14, 'text-anchor': 'middle' }); t.textContent = r.label.length > 7 ? r.label.slice(2) : r.label; svg.append(t); }
      if (r.value === max || i === rows.length - 1) { const t = el('text', { x: x + bw / 2, y: y - 4, 'text-anchor': 'middle', style: 'fill:var(--ink);font-weight:600' }); t.textContent = r.display; svg.append(t); }
    });
    box.append(svg);
  } else {
    const rowH = 22, LW = 150, W = 520, H = rows.length * rowH + 6;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, preserveAspectRatio: 'none' });
    rows.forEach((r, i) => {
      const y = i * rowH + 3, w = Math.max(2, (W - LW - 90) * r.value / max);
      const t = el('text', { x: LW - 8, y: y + 14, 'text-anchor': 'end', style: 'fill:var(--ink)' }); t.textContent = r.label.length > 22 ? r.label.slice(0, 21) + '…' : r.label; svg.append(t);
      const rect = el('rect', { x: LW, y: y + 3, width: w, height: rowH - 8, rx: 3, class: 'bar' }); rect.onmousemove = (e) => show(e, r); rect.onmouseleave = hide; svg.append(rect);
      const v = el('text', { x: LW + w + 6, y: y + 14, style: i === 0 ? 'fill:var(--ink);font-weight:600' : '' }); v.textContent = r.display; svg.append(v);
    });
    box.append(svg);
  }
  return box;
}

async function render() {
  await renderPage();
  // Page actions (the buttons a page puts at its top) sit at the right of the tab row, like any ERP.
  const main = document.getElementById('main');
  const tabs = main.querySelector('.tabs');
  const acts = tabs && [...main.children].find(el => el.classList && el.classList.contains('acts') && el.querySelector('button'));
  if (tabs && acts && acts.querySelectorAll('button').length <= 4 && !acts.querySelector('select')) { acts.classList.add('tabacts'); tabs.append(acts); }
}

    const back = $('<button style="margin-bottom:16px">← back</button>'); back.onclick = () => { selected = null; render(); };
    main.append(back, await detail(selected.type, selected.id)); return;
  }
  const head = (title, sub) => {
    const ent = navFor(view);
    if (ent && ent.tabs.length > 1) main.append($(`<div class="crumbs">${ent.label}</div>`));
    const h = $(`<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><h2 style="margin:0">${title}</h2>
      <input class="pagefilter" placeholder="filter…" style="width:220px;font-size:13px;padding:5px 10px"></div>`);
    h.querySelector('.pagefilter').oninput = (e) => {
      const terms = e.target.value.toLowerCase().split(/\s+/).filter(Boolean);
      main.querySelectorAll('tbody tr').forEach(tr => {
        const hay = (tr.dataset.search || tr.textContent).toLowerCase();
        tr.style.display = terms.every(t => hay.includes(t)) ? '' : 'none';
      });
    };
    main.append(h, $(`<div class="sub">${sub}</div>`));
    if (ent && ent.tabs.length > 1) main.append(tabsFor(ent));
    // Signed in: the connect card lives on Home. In a sandbox: on the first page of any module, until dismissed.
    const cc = (REG.user ? view === 'home' : (ent && ent.tabs[0][0] === view && ent.key !== 'spec' && ent.key !== 'audit')) ? connectCard() : null;
    if (cc) main.append(cc);

  // rowsInto is renderPage's own: it appends into this page's main. The row building itself
  // is fillRows, at module scope, because detail panels build the same tables into their own
  // container — a helper only one function can see is a helper the other one crashes on.
  const rowsInto = (t, rows, cells, type) => { main.append(fillRows(t, rows, cells, type)); };

    </div>`);

  if (view === 'bridgeaccounts') {

    const a = await api('bridge_accounts', {});

    main.append($(`<p class="sub" style="margin-top:14px;max-width:760px">Xero matches on the code, QuickBooks on the name. Ask your accountant for both and they are set once. Changing a mapping never rewrites a hand-over that already went out.</p>`));
  }
  if (view === 'bridgeexport') {
    head('Export', 'Hand a period to the ledger of record: QuickBooks, Xero, or a plain CSV. Nothing is posted; you send the file.');
    const bar = $('<div class="acts" style="margin-bottom:14px"></div>'); newButtons('bridge_export').forEach(b => bar.append(b)); main.append(bar);
    const a = await api('bridge_accounts', {});
    const ex = await api('bridge_exports', {});
    const box = $(`<div class="card" style="max-width:900px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <label style="font-size:12px;color:var(--dim)">Shape<br><select id="bfmt" style="font-size:13px;padding:5px 8px">${a.formats.map(f => `<option value="${f.format}">${f.label}</option>`).join('')}</select></label>

    const show = async () => {

      out.innerHTML = '';
      out.append($(`<div class="sub" style="margin:0 0 8px">${p.entry_count} entries · ${p.line_count} lines · ${p.debits_display} each side${p.continues_from ? ` · continues from ${p.continues_from}` : ''}${p.currencies.length > 1 ? ` · <span style="color:var(--warn)">${p.currencies.join(' and ')}</span>` : ''}</div>`));
      out.append($(`<div class="doc" style="margin-bottom:10px${p.left_out && p.left_out.count ? ';color:var(--warn)' : ''}">${p.next}</div>`));
      if (p.left_out && p.left_out.count) {
        const lt = $('<table style="margin-bottom:12px"><thead><tr><th>Not in this file</th><th>Date</th><th>Description</th><th class="num">Amount</th><th>Why</th></tr></thead><tbody></tbody></table>');
        for (const r of p.left_out.rows) lt.querySelector('tbody').append($(`<tr><td>${r.id}</td><td style="font-size:12px">${r.date}</td><td>${r.description}</td><td class="num">${r.amount_display}</td><td style="font-size:12px;color:var(--dim)">${r.why}</td></tr>`));
        out.append(lt);
      }
      if (p.sample_rows.length) {
        const t = $(`<table><thead><tr>${p.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
        for (const r of p.sample_rows) t.querySelector('tbody').append($(`<tr>${r.map(c => `<td style="font-size:12.5px">${String(c).replace(/</g, '&lt;')}</td>`).join('')}</tr>`));
        out.append(t);
        if (p.truncated) out.append($(`<p class="sub" style="margin-top:8px">First ${p.sample_rows.length} of ${p.line_count} lines.</p>`));

    };
    box.querySelector('#bprev').onclick = show; show();
    if (Object.keys(ex.through).length) main.append($(`<p class="sub" style="margin-top:14px">Already handed over: ${Object.entries(ex.through).map(([f, d]) => `${f} through ${d}`).join(' · ')}.</p>`));
  }
  if (view === 'bridgeexports') {
    head('Hand-overs', 'What went to the ledger, in which shape, through when. Each link re-downloads the exact file that went out.');
    const ex = await api('bridge_exports', {});
    if (!ex.count) { main.append($('<div class="card doc" style="max-width:640px">Nothing handed over yet. Map the accounts, then export a period.</div>')); return; }
    const t = $('<table><thead><tr><th>Id</th><th>Shape</th><th>Period</th><th class="num">Entries</th><th class="num">Lines</th><th class="num">Debits</th><th>Who</th><th>File</th></tr></thead><tbody></tbody></table>');
    rowsInto(t, ex.exports, r => `<td>${r.id}</td><td>${r.format}</td><td style="font-size:12px">${r.period_from || 'the beginning'} → ${r.period_to}</td>
      <td class="num">${r.entry_count}</td><td class="num">${r.line_count}</td><td class="num">${r.debits_display}</td>
      <td style="font-size:12px">${r.actor}<br><span style="color:var(--dim)">${(r.created_at || '').slice(0, 10)}</span></td>
      <td><a href="/journal/${REG.workspace}/${r.token}.csv" onclick="event.stopPropagation()">download</a> <span style="color:var(--dim);font-size:11px">${r.hash}</span></td>`, 'nolink');
    main.append(t);
  }
  if (view === 'company') {
    head('Company', "Your business's own facts — the seller on every document. More business-level records will live here.");

    const has = p && p.name;
    const bar = $('<div class="acts" style="margin-bottom:14px"></div>');
    const eb = $(`<button class="primary">${has ? 'Edit profile' : 'Set company profile'}</button>`);
    eb.onclick = () => {
      const spec2 = cmd('core_set_company_profile');
      const pre = {};
      if (has) for (const f2 of spec2.fields) if (p[f2.key] !== undefined && p[f2.key] !== null) pre[f2.key] = p[f2.key];
      openForm(spec2, pre);
    };
    bar.append(eb);
    if (has) {
      const lb = $(`<button>${p.logo ? 'Change logo…' : 'Add logo…'}</button>`);
      lb.onclick = () => openForm(cmd('core_set_company_logo'), { remove: false });
      bar.append(lb);
      if (p.logo) {
        const rb = $('<button>Remove logo</button>');
        rb.onclick = async () => { await api('core_set_company_logo', { remove: true, _reason: 'removed from the Company page' }); location.reload(); };
        bar.append(rb);
      }
    }
    main.append(bar);
    if (!has) {
      main.append($('<div class="card doc">Nothing set yet. The invoice document prints without a seller block until this exists — incomplete, not wrong (INV-22).</div>'));
    } else {
      const nl2 = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\n/g, '<br>');
      main.append($(`<div class="card" style="max-width:640px">
        ${p.logo ? `<img src="${p.logo}" alt="" style="max-height:72px;max-width:240px;display:block;margin-bottom:12px">` : ''}
        <h2 style="margin-bottom:4px">${nl2(p.name)}</h2>
        <div class="kv">
          ${p.address ? `<div><span>Address</span>${nl2(p.address)}</div>` : ''}
          ${p.tax_id ? `<div><span>${nl2(p.tax_id_label || 'Tax id')}</span>${nl2(p.tax_id)}</div>` : ''}
          <div><span>Country</span>${p.country ? nl2(p.country) : '— (dates and amounts print US-style)'}</div>
          <div><span>Currencies</span>${(p.currencies || ['USD']).map(c => c === p.currency ? `<b>${c}</b>` : c).join(', ')}${(p.currencies || []).length > 1 ? ' <span style="color:var(--dim)">(default in bold; each invoice picks one)</span>' : ''}</div>
          <div><span>Tax</span>${p.tax_registered ? `registered for ${nl2(p.tax_label || 'tax')}, default ${(p.tax_rate_bp / 100).toFixed(2).replace(/\.?0+$/, '')}% — documents print TAX INVOICE` : `not registered${p.tax_label ? ' for ' + nl2(p.tax_label) : ''} — lines cannot carry tax`}</div>
          <div><span>Numbering</span>${nl2(p.number_format || 'INV-{NNNN}')}</div>
        </div>
        ${p.payment_instructions ? `<div style="margin-top:12px"><b>Payment instructions — printed on every invoice</b><div class="doc" style="margin-top:4px">${nl2(p.payment_instructions)}</div></div>` : ''}
        ${p.footer_note ? `<div style="margin-top:12px"><b>Document footer</b><div class="doc" style="margin-top:4px">${nl2(p.footer_note)}</div></div>` : ''}
        <div style="margin-top:12px;font-size:12px;color:var(--dim)">Last changed ${(p.updated_at || '').slice(0, 16).replace('T', ' ')} — every change is in the audit trail.</div>
      </div>`));
    }
  }
  if (view === 'audit') {
    head('Audit trail', 'Every write from either surface, with its actor. Refused commands are kept.');
    main.append(auditTable(await api('core_audit', { limit: 100 })));
  }
  if (view === 'spec') {
    window.specArea = window.specArea || (REG.areas && REG.areas[0]) || 'o2c';
    const AREA = window.specArea;
    const { report, spec } = await fetch('/api/spec?area=' + AREA).then(r => r.json());
    head('Spec — ' + AREA + ' @ ' + spec.spec, 'The spec as a live object: status is derived from the implements map and the last conformance run — never asserted.');
    if (REG.areas && REG.areas.length > 1) {
      const tabs = $('<div class="acts" style="margin-bottom:14px"></div>');
      for (const a2 of REG.areas) {
        const b = $(`<button ${a2 === AREA ? 'class="primary"' : ''}>${a2}</button>`);
        b.onclick = () => { window.specArea = a2; render(); };
        tabs.append(b);
      }
      main.append(tabs);
    }
    if (!report) { main.append($('<div class="card doc">No conformance run recorded yet. Run npm test, or replay a scenario below.</div>')); return; }

    const k = $(`<div class="card"><div class="kv">
      <div><span>Module</span>${report.module}</div>
      <div><span>Acts implemented</span>${report.acts.filter(a=>a.implemented).length} / ${report.acts.length}</div>
      <div><span>Scenarios</span>${report.scenarios.filter(s=>s.pass).length} / ${report.scenarios.length} passing</div>
      <div><span>Last run</span>${report.ran_at.slice(0,19).replace('T',' ')}</div>
      <div><span>Status</span><span class="badge ${report.pass?'pass':'fail'}">${report.pass?'conformant':'failing'}</span></div>
    </div></div>`);
    main.append(k);

    /* Scenarios first — they are the teaching material. */
    main.append($('<div class="sub" style="margin-top:8px">Scenarios — Walk through shows every form filled in, one step at a time, and runs it live. Replay runs the whole trace at once. Both use a scratch workspace, never your data.</div>'));
    const renderSteps = (box, sc) => {
      box.innerHTML = '';
      for (const st of sc.steps) {
        const d = $(`<div class="step ${st.pass?'pass':'fail'}">
          <div class="hd">${st.pass?'✓':'✗'} <span class="act-name">${st.act}</span>
            <span class="cmd">→ ${st.command||'(unmapped)'}${st.phase==='env'?' · setup':''}</span>
            <span class="cmd">${st.expect.refused ? 'expect refusal: “'+st.expect.refused+'”' : 'expect ok'+(st.expect.include?' + '+JSON.stringify(st.expect.include):'')}</span></div>
          ${st.notes ? `<div class="teach">${st.notes}</div>` : ''}
          <pre>args   ${JSON.stringify(st.args)}
result ${st.actual}</pre>
          ${st.refusal && !st.pass ? `<div style="color:var(--warn)">${st.refusal}</div>` : ''}
        </div>`);
        box.append(d);
      }
    };
    for (const sc of report.scenarios) {
      const det = $(`<details class="scen"><summary>
        <span class="badge ${sc.pass?'pass':'fail'}">${sc.pass?'pass':'fail'}</span>
        <b>${sc.name}</b>
        <span style="color:var(--dim);font-size:12px">${sc.file}</span>
        <span style="flex:1"></span>
      </summary><div class="body">
        ${sc.notes ? `<div class="doc" style="margin-bottom:6px">${sc.notes}</div>` : ''}
        <div class="steps"></div>
      </div></details>`);
      const walkBtn = $('<button class="primary" style="font-size:12px;padding:4px 10px">Walk through</button>');
      walkBtn.onclick = (ev) => { ev.preventDefault(); startWalk(sc.file); };
      const btn = $('<button style="font-size:12px;padding:4px 10px">Replay</button>');
      btn.onclick = async (ev) => {
        ev.preventDefault(); btn.disabled = true; btn.textContent = 'running…';
        const fresh = await fetch('/api/spec/replay?area=' + (window.specArea || 'o2c') + '&file=' + encodeURIComponent(sc.file), { method:'POST' }).then(r => r.json());
        renderSteps(det.querySelector('.steps'), fresh);
        det.open = true;
        det.querySelector('.badge').className = 'badge ' + (fresh.pass?'pass':'fail');
        det.querySelector('.badge').textContent = fresh.pass?'pass':'fail';
        btn.disabled = false; btn.textContent = 'Replay';
      };
      det.querySelector('summary').append(walkBtn, btn);
      renderSteps(det.querySelector('.steps'), sc);
      main.append(det);
    }

    main.append($('<div class="sub" style="margin-top:18px">Acts — spec surface vs implementation</div>'));
    const at = $('<table><thead><tr><th>Act</th><th>Kind</th><th>Command</th><th>Implemented</th><th>Exercised by a scenario</th></tr></thead><tbody></tbody></table>');
    for (const a of report.acts) at.querySelector('tbody').append($(
      `<tr><td>${a.act}</td><td>${a.kind}</td><td style="font-family:var(--mono);font-size:12px">${a.command||'—'}</td>
       <td>${a.implemented?'✓':'<span style="color:var(--warn)">missing</span>'}</td><td>${a.exercised?'✓':'<span style="color:var(--dim)">not yet</span>'}</td></tr>`));
    main.append(at);

    main.append($('<div class="sub" style="margin-top:18px">Invariants — and what exercises each</div>'));
    const it = $('<table><thead><tr><th>Id</th><th>Invariant</th><th>Evidence</th></tr></thead><tbody></tbody></table>');
    for (const inv of report.invariants) it.querySelector('tbody').append($(
      `<tr class="invrow"><td>${inv.id}</td><td>${inv.title}</td>
       <td style="font-size:12.5px;color:${inv.evidence.length?'var(--dim)':'var(--warn)'}">${inv.evidence.length ? inv.evidence.join('<br>') : 'no evidence yet'}</td></tr>`));
    main.append(it);
  }
  if (view === 'doctrine') {
    head('Doctrine', 'The rules the agent reads at connect. The same text a person reads here.');
    main.append($(`<div class="card doc">${REG.doctrine}</div>`));
    for (const m of REG.modules.filter(m => m.doctrine)) main.append($(`<div class="card"><b>module: ${m.name}</b><div class="help">${m.doctrine}</div></div>`));
    for (const c of REG.commands.filter(c => c.help)) main.append($(`<div class="card"><b>${c.title}</b> <span class="doc">— ${c.name}</span><div class="help">${c.help}</div></div>`));
  }
}

      } catch (e) { body.querySelector('#invOut').innerHTML = `<div class="err" style="padding:0">${e.message}</div>`; }
    };
    body.querySelector('#invGo').onclick = async () => {
      const name = body.querySelector('#invName').value.trim();

      if (!name) return;
      try {

        body.querySelector('#invOut').append($(`<div class="card" style="margin-bottom:12px"><b>${m.name}</b> · <span class="pill">${m.role}</span>
          <div style="margin-top:10px;font-size:12px;color:var(--dim)">FOR AN AGENT — paste as the connector URL in Claude (Customize → Connectors → Add):</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
            <code style="user-select:all;flex:1;overflow-wrap:anywhere">${mcpUrl}</code>
            <button type="button" class="primary" style="font-size:11px;flex:none" onclick="navigator.clipboard.writeText('${mcpUrl}');this.textContent='Copied ✓'">Copy connector URL</button></div>
          <div style="margin-top:12px;font-size:12px;color:var(--dim)">FOR A PERSON — opens this space in their browser:</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
            <code style="user-select:all;flex:1;overflow-wrap:anywhere">${joinUrl}</code>
            <button type="button" style="font-size:11px;flex:none" onclick="navigator.clipboard.writeText('${joinUrl}');this.textContent='Copied ✓'">Copy browser link</button></div>
          <div style="margin-top:10px;font-size:11px;color:var(--dim)">Claude Code CLI instead: <code style="user-select:all">claude mcp add -t http ${m.name} ${mcpUrl}</code></div></div>`));
        drawMembers();
      } catch (e) { body.querySelector('#invOut').innerHTML = `<div class="err" style="padding:0">${e.message}</div>`; }
    };
    const drawMembers = async () => {
      const res2 = await api('core_members', {});
      const ms = res2.members, ems = res2.email_members || [];
      const box = body.querySelector('#memList'); box.innerHTML = '';
      if (ems.length) {
        const et = $('<table style="margin-bottom:10px"><thead><tr><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>');
        for (const m of ems) {
          const tr = $(`<tr><td>${m.email}</td><td><span class="pill">${m.role}</span></td><td>${m.revoked_at ? '<span style="color:var(--warn)">revoked</span>' : m.joined ? 'active' : 'invited — joins on first sign-in'}</td><td></td></tr>`);
          if (!m.revoked_at) { const b = $('<button type="button" style="font-size:11px">Revoke</button>'); b.onclick = async () => { await api('core_revoke_member', { name: m.email, _reason: 'revoked email member' }); drawMembers(); }; tr.lastElementChild.append(b); }
          et.querySelector('tbody').append(tr);
        }
        box.append(et);
      }
      if (!ms.length && !ems.length) { box.append($('<div class="sub">No members yet — it\'s just you.</div>')); return; }
      if (!ms.length) return;
      const t = $('<table><thead><tr><th>Name</th><th>Role</th><th>Key</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>');
      for (const m of ms) {
        const tr = $(`<tr><td>${m.name}</td><td><span class="pill">${m.role}</span></td><td style="font-family:var(--mono);font-size:11px">${m.token_hint}</td>
          <td>${m.revoked_at ? '<span style="color:var(--warn)">revoked</span>' : 'active'}</td><td></td></tr>`);
        if (!m.revoked_at) {
          const b = $('<button type="button" style="font-size:11px">Revoke</button>');
          b.onclick = async () => { await api('core_revoke_member', { name: m.name, _reason: 'revoked from the workbench' }); drawMembers(); };
          tr.lastElementChild.append(b);
        }
        t.querySelector('tbody').append(tr);
      }
      box.append(t);
    };
    drawMembers();
  };
  await draw();
  dlg.showModal();
}

/* ---------- the walkthrough: the same generated forms, filled in, one step at a time ----------
   For each step: show the command's form exactly as a person would have filled it, say what
   should happen, then run it for real in a scratch workspace and show what did happen —
   refusals included, because the refusals teach the rules. */
const money$ = (c) => '$' + (c/100).toFixed(2);
function fieldPreview(fld, value) {
  const wrap = $(`<label><b>${fld.label}</b></label>`);
  if (value === undefined || value === null) {
    wrap.append($('<input disabled placeholder="—">')); wrap.style.opacity = .55; return wrap;
  }
  if (fld.widget === 'lines' && Array.isArray(value)) {
    const t = $('<table class="lines"><thead><tr>' + fld.of.map(c => `<th>${c.label}</th>`).join('') + '</tr></thead><tbody></tbody></table>');
    for (const row of value) t.querySelector('tbody').append($('<tr>' + fld.of.map(c => {
      const v = row[c.key];
      return `<td><input disabled value="${v === undefined ? '' : (c.widget === 'money' ? money$(v) : v)}"></td>`;
    }).join('') + '</tr>'));
    wrap.append(t); return wrap;
  }
  const shown = fld.widget === 'money' ? money$(value) : fld.widget === 'checkbox' ? (value ? 'yes' : 'no') : String(value);
  wrap.append($(`<input disabled value="${String(shown).replace(/"/g,'&quot;')}">`));
  return wrap;
}

async function startWalk(file) {
  const plan = await fetch(wsUrl('/api/spec/plan?area=' + (window.specArea || 'o2c') + '&file=' + encodeURIComponent(file))).then(r => r.json());
  let i = 0, ran = false, passes = 0;
  const ov = $('<div id="walkOv"></div>');
  const close = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) close(); };

  const show = () => {
    const st = plan.steps[i];
    const cmd = REG.commands.find(c => c.name === st.command);
    ov.innerHTML = '';
    const card = $(`<div class="walk">
      <header>
        <b style="font-size:14px">${plan.name}</b>
        <div class="prog"><i style="width:${Math.round(100 * i / plan.steps.length)}%"></i></div>
        <button data-x style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--dim)">×</button>
      </header>
      <div class="body">
        <div class="phase">${st.phase === 'env' ? 'setting the stage' : 'step'} · ${st.expect.refused ? 'this one gets refused — that is the lesson' : 'this one goes through'}</div>
        <h3 class="act">${cmd ? cmd.title : st.act}</h3>
        <div class="cmdname">${st.act} → ${st.command}</div>
        ${st.notes ? `<div class="note">${st.notes}</div>` : ''}
        <div class="formprev"></div>
        <div class="expect">${st.expect.refused
          ? `Expected: <b>refused</b>, with a message containing “${st.expect.refused}”`
          : `Expected: <b>goes through</b>${st.expect.include ? ' — ' + Object.entries(st.expect.include).map(([k,v]) => `${k} = ${typeof v === 'number' && /total|amount|open|committed|balance|subtotal|tax|limit|price/.test(k) ? money$(v) : v}`).join(', ') : ''}`}</div>
        <div class="result"></div>
      </div>
      <footer>
        <span class="stepno">step ${i + 1} of ${plan.steps.length}</span>
        <button class="primary runbtn">${st.expect.refused ? 'Try it ▸' : 'Run this step ▸'}</button>
      </footer>
    </div>`);
    card.querySelector('[data-x]').onclick = close;
    const prev = card.querySelector('.formprev');
    if (cmd) for (const fld of cmd.fields) prev.append(fieldPreview(fld, st.args[fld.key]));
    else prev.append($(`<pre>${JSON.stringify(st.args, null, 1)}</pre>`));

    const runbtn = card.querySelector('.runbtn');
    runbtn.onclick = async () => {
      runbtn.disabled = true; runbtn.textContent = 'running…';
      const r = await fetch(wsUrl(`/api/spec/walk?area=${window.specArea || 'o2c'}&file=${encodeURIComponent(file)}&step=${i}`), { method: 'POST' }).then(x => x.json());
      ran = true; if (r.pass) passes++;
      const res = card.querySelector('.result');
      res.innerHTML = '';
      res.append($(`<div class="outcome ${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'} ${
        r.expect.refused ? (r.pass ? 'Refused, exactly as the rule says:' : 'Did not go as expected:') : (r.pass ? 'Done.' : 'Did not go as expected:')
      }
${r.actual}</div>`));
      runbtn.disabled = false;
      if (r.done) {
        runbtn.textContent = 'Finish';
        runbtn.onclick = () => {
          ov.querySelector('.body').innerHTML = `<h3 class="act" style="margin-top:6px">That was the whole flow.</h3>
            <p style="font-size:14px;color:var(--dim)">${passes} of ${plan.steps.length} steps behaved exactly as the spec says — refusals included.
            Every one of them just ran for real, through the same registry the buttons and the agent use.
            The scratch workspace it happened in is already gone; your data was never touched.</p>`;
          ov.querySelector('footer').innerHTML = '';
          const done = $('<button class="primary">Close</button>'); done.onclick = close;
          ov.querySelector('.walk footer, footer') || ov.querySelector('.walk').append($('<footer></footer>'));
          ov.querySelector('.walk footer').append(done);
        };
      } else {
        runbtn.textContent = 'Next step ▸';
        runbtn.onclick = () => { i = r.index + 1; show(); };
      }
      card.querySelector('.prog i').style.width = Math.round(100 * (i + 1) / plan.steps.length) + '%';
    };
    ov.append(card);
  };
  show();
  document.body.append(ov);
}

const boot = async () => {
  // An invite link (?join=<member key>) goes to the server once, on this first call, which pins
  // the key in the cookie; then it leaves the address bar so the key is not left lying around.
  const join = new URLSearchParams(location.search).get('join');
  const regUrl = wsUrl('/api/registry');
  REG = await fetch(join ? regUrl + (regUrl.includes('?') ? '&' : '?') + 'join=' + encodeURIComponent(join) : regUrl).then(r => r.json());
  if (join) { const q = new URLSearchParams(location.search); q.delete('join'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }
  const has = (prefix) => REG.commands.some(c => c.name.startsWith(prefix));
  // A view that does not exist in this space lands on the first module that does.
  if (!navFor(view) || (navFor(view).prefix && !has(navFor(view).prefix)) || (navFor(view).when && !navFor(view).when())) view = firstView();
  if (!window.__landed && !location.hash) {
    if (REG.user && REG.spaces.length > 1 && !new URLSearchParams(location.search).has('ws')) view = 'home';
    else if (REG.demo && !REG.user) view = 'home';
    // Books on a Mac (hostel's, or a checkout) open on what they hold, like the demo does.
    else if (!REG.demo) view = 'home';
  }
  window.__landed = true;
  buildRail();
  // Space switcher (top bar)
  const sw = document.getElementById('spaceSw');
  const KIND = { solo: 'invoicing', hunt: 'job hunt' };
  if (REG.user) {
    const cur = REG.spaces.find(x => x.ws === REG.workspace) || { name: REG.space || REG.workspace };
    sw.innerHTML = `<button>${cur.name} <small>· ${spaceLabel(cur)} · ${REG.member.role}</small><span class="chev">▾</span></button><div class="pop">${REG.spaces.map(x => `<a href="/app?ws=${x.ws}" class="${x.ws === REG.workspace ? 'on' : ''}">${x.name} <span style="color:var(--dim);font-weight:400">· ${spaceLabel(x)} · ${x.role}</span></a>`).join('')}<div class="sep"></div><button class="item" id="newSpace">+ New space…</button><a href="/app#home" id="allSpaces">All spaces</a></div>`;
    sw.querySelector('button').onclick = (e) => { e.stopPropagation(); pop(sw.querySelector('.pop')); };
    sw.querySelector('#allSpaces').onclick = (e) => { e.preventDefault(); selected = null; view = 'home'; sw.querySelector('.pop').classList.remove('open'); render(); };
    sw.querySelector('#newSpace').onclick = () => { sw.querySelector('.pop').classList.remove('open'); selected = null; view = 'newspace'; render(); };
  } else if (REG.demo) {
    const mcpUrl = location.origin + '/mcp/' + REG.workspace;
    sw.innerHTML = `<button>Your sandbox <small>· ${REG.workspace}</small><span class="chev">▾</span></button><div class="pop"><div class="hint">Private to you, swept after 24 hours. Sign in to keep it.</div><button class="item" id="mcpCopy">Copy connector URL</button>${REG.grants.includes('workspace.admin') ? '<button class="item" id="demoReset">Reset demo data</button><button class="item" id="shareBtn">Share this sandbox…</button>' : ''}${REG.auth_enabled ? '<div class="sep"></div><a href="/auth/google"><b>Sign in with Google</b> — keep this space</a>' : ''}</div>`;
    sw.querySelector('button').onclick = (e) => { e.stopPropagation(); pop(sw.querySelector('.pop')); };
    sw.querySelector('#mcpCopy').onclick = (e) => { navigator.clipboard.writeText(mcpUrl); e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy connector URL', 1500); };
    const dr = sw.querySelector('#demoReset'); if (dr) dr.onclick = async () => { await api('core_reset_workspace', { fixture: 'try', _reason: 'visitor reset their sandbox' }); await boot(); render(); };
    const sb = sw.querySelector('#shareBtn'); if (sb) sb.onclick = () => openInvite();
  } else {
    sw.innerHTML = `<button>workspace: ${REG.workspace}<span class="chev">▾</span></button><div class="pop">${REG.workspaces.map(w => `<a href="?ws=${encodeURIComponent(w)}" class="${w === REG.workspace ? 'on' : ''}">${w}</a>`).join('')}<div class="sep"></div><button class="item" id="newWs">+ new workspace…</button></div>`;
    sw.querySelector('button').onclick = (e) => { e.stopPropagation(); pop(sw.querySelector('.pop')); };
    sw.querySelector('#newWs').onclick = () => { const w = prompt('Workspace name (lowercase, digits, - _):'); if (w) location.search = '?ws=' + encodeURIComponent(w.trim()); };
  }
  // Person menu (top bar, right)
  const who = document.getElementById('whoBox');
  if (REG.user) {
    const initials = (REG.user.name || REG.user.email).split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
    who.innerHTML = `<button><span>${REG.user.name || REG.user.email}</span><span class="avatar">${REG.user.picture ? `<img src="${REG.user.picture}" referrerpolicy="no-referrer">` : initials}</span></button>
      <div class="pop right"><div class="hint">${REG.user.email}<br>in this space: <b>${REG.member.role}</b></div>${REG.grants.includes('workspace.admin') ? '<button class="item" id="inviteBtn">Share this space…</button>' : ''}${REG.member.role === 'owner' && REG.space ? `<a href="${wsUrl('/api/export')}">Export these books (JSON)</a><button class="item" id="delSpaceBtn" style="color:var(--warn)">Delete this space…</button>` : ''}<div class="sep"></div><a href="/auth/logout">Sign out</a></div>`;
    who.querySelector('button').onclick = (e) => { e.stopPropagation(); pop(who.querySelector('.pop')); };
    const ib = who.querySelector('#inviteBtn'); if (ib) ib.onclick = () => openInvite();
    const delBtn = who.querySelector('#delSpaceBtn');
    if (delBtn) delBtn.onclick = async () => {
      const name2 = REG.space;
      const typed = prompt(`This permanently deletes the space "${name2}" — its books, audit trail, and every access key. Export first if you want a copy.\n\nType the space name to confirm:`);
      if (typed === null) return;
      if (typed.trim() !== name2) { toast('Name did not match — nothing deleted'); return; }
      const r = await fetch(wsUrl('/api/space/delete'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ws: REG.workspace }) }).then(x => x.json());
      if (r.ok) location.href = '/app'; else toast('✗ ' + (r.error || 'delete failed'));
    };
  } else {
    who.innerHTML = REG.auth_enabled ? `<a href="/auth/google" style="font:600 13px var(--display);color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:6px 12px">Sign in with Google</a>` : `<span style="font-size:13px;color:var(--dim)">${REG.member.name} · ${REG.member.role}</span>`;
  }
};
if (['spec', 'doctrine', 'audit', 'home', 'newspace'].includes(location.hash.slice(1))) view = location.hash.slice(1);
document.getElementById('gsearch').onkeydown = (e) => { if (e.key === 'Enter') { window.__q = e.target.value.trim(); selected = null; view = 'search'; render(); } };
